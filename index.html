  renderSections();
}

function renderSections(){
  const song = getSong();
  const host = document.getElementById('sectionsHost');
  const cfg = TALAS[song.tala];
  const kalai = song.kalai || 1;
  const derived = derivedPallaviOpening(song);
  host.innerHTML = '';
  song.sections.forEach((sec, si)=>{
    const card = document.createElement('div');
    card.className = 'card';
    const refBlock = si === 0 ? '' : `
      <div class="fieldwrap" style="border-top:1px dashed var(--line); padding-top:10px; margin-top:14px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" data-si="${si}" class="secShowRef" ${sec.showPallaviRef ? 'checked' : ''} style="width:auto;">
          Insert "(Pallavi opening line)" note once, after this section
        </label>
        <input type="text" data-si="${si}" class="secPallaviOverride" placeholder="(auto: ${escapeHtml(derived || 'first 2 words of Pallavi sahitya')})" value="${escapeHtml(sec.pallaviOverride)}" style="margin-top:6px; ${sec.showPallaviRef?'':'display:none;'}" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
      </div>`;
    card.innerHTML = `
      <div class="section-head">
        <input value="${escapeHtml(sec.name)}" data-si="${si}" class="secName" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
        <button class="btn small danger" data-si="${si}" data-act="delSec">Remove section</button>
      </div>
      <div class="fieldwrap">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:600; font-size:12.5px;">
          <input type="checkbox" data-si="${si}" class="secNoSahitya" ${sec.noSahitya ? 'checked' : ''} style="width:auto;">
          No sahitya for this section (e.g. Chittaswaram)
        </label>
      </div>
      <div class="fieldwrap secSahityaWrap" data-si="${si}" style="${sec.noSahitya ? 'display:none;' : ''}"><label>Sahitya (plain lyrics)</label><textarea data-si="${si}" class="secSahitya" placeholder="Plain lyric lines, as in your original template…" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">${escapeHtml(sec.sahitya)}</textarea></div>
      <div class="linesHost" data-si="${si}"></div>
      <button class="btn small add-line-btn" data-si="${si}" data-act="addLine">+ Add line (avartanam / sangati)</button>
      ${refBlock}
    `;
    host.appendChild(card);

    card.querySelector('.secName').oninput = e=>{ sec.name = e.target.value; queueSave(); };
    card.querySelector('.secSahitya').oninput = e=>{
      sec.sahitya = e.target.value; queueSave();
      // Previously called renderSections() here when si===0, which tore down and
      // rebuilt the whole sections list on every keystroke — destroying this very
      // textarea and dropping cursor focus mid-type. All that was actually needed
      // is to keep the "(auto: first two words…)" placeholder hint on OTHER
      // sections' Pallavi-override fields in sync, so just patch those directly.
      if(si === 0){
        const derived = derivedPallaviOpening(getSong());
        document.querySelectorAll('.secPallaviOverride').forEach(el=>{
          el.placeholder = `(auto: ${derived || 'first 2 words of Pallavi sahitya'})`;
        });
      }
    };
    card.querySelector('.secNoSahitya').onchange = e=>{
      sec.noSahitya = e.target.checked;
      card.querySelector('.secSahityaWrap').style.display = sec.noSahitya ? 'none' : '';
      queueSave();
      renderLines(card.querySelector('.linesHost'), sec, cfg, kalai);
    };
    const refCheck = card.querySelector('.secShowRef');
    if(refCheck){
      refCheck.onchange = e=>{
        sec.showPallaviRef = e.target.checked;
        card.querySelector('.secPallaviOverride').style.display = sec.showPallaviRef ? '' : 'none';
        queueSave();
      };
    }
    const refOverride = card.querySelector('.secPallaviOverride');
    if(refOverride){ refOverride.oninput = e=>{ sec.pallaviOverride = e.target.value; queueSave(); }; }
    card.querySelector('[data-act="delSec"]').onclick = ()=>{
      if(confirm('Remove this section?')){ song.sections.splice(si,1); queueSave(); renderSections(); }
    };
    card.querySelector('[data-act="addLine"]').onclick = ()=>{
      sec.lines.push(blankLine(cfg, kalai)); queueSave(); renderSections();
    };

    renderLines(card.querySelector('.linesHost'), sec, cfg, kalai);
  });

  wireGlobalCtrlNavigation(host);
}

function cellWidthPx(capacity){ return Math.max(46, capacity*13+18); }

/* builds the cell markup + column widths for ONE physical row (no edge marks) */
function buildRowGrid(cfg, noSahitya){
  let cellsHtml = '';
  const cols = [];
  cfg.rowCells.forEach((cap, i)=>{
    cols.push(cellWidthPx(cap) + 'px');
    cellsHtml += `
      <div class="beat-cell" data-cap="${cap}" title="${cap} aksharas — wrap text in *single* or **double** for speed underline">
        <input class="swara" placeholder="swara" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
        <div class="aksh-badge"></div>
        ${noSahitya ? '' : `
        <input class="lyric" placeholder="sahitya" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
        <div class="align-badge"></div>`}
      </div>`;
    if(i === cfg.dividerAfter && i !== cfg.rowCells.length - 1){
      cols.push('22px');
      const glyph = cfg.dividerType === 'pipe' ? '|' : '\u2551';
      cellsHtml += `<div class="sep-cell">${glyph}</div>`;
    }
  });
  return { cellsHtml, cols };
}

function ensureLineShape(line, cfg, kalai){
  const n = numRowsForLine(cfg, kalai);
  const cellCount = cfg.rowCells.length;
  while(line.rows.length < n) line.rows.push(blankRow(cellCount));
  line.rows.length = n;
  line.rows.forEach(r=>{
    while(r.swara.length < cellCount){ r.swara.push(''); r.lyric.push(''); }
    r.swara.length = cellCount; r.lyric.length = cellCount;
  });
}

function renderLines(host, sec, cfg, kalai){
  host.innerHTML = '';
  const noSahitya = !!sec.noSahitya;
  sec.lines.forEach((line, li)=>{
    ensureLineShape(line, cfg, kalai);

    const row = document.createElement('div');
    row.className = 'line-row';

    const rowsHtml = line.rows.map((r, ri)=>{
      const { cellsHtml, cols } = buildRowGrid(cfg, noSahitya);
      const edgeLeft = ri === 0 ? '\u2551' : '';
      const edgeRight = ri === line.rows.length - 1 ? '\u2551' : '';
      return `
        <div class="grid-wrap phys-row" data-ri="${ri}">
          <div class="beat-grid" style="grid-template-columns:22px ${cols.join(' ')} 22px;">
            <div class="edge-mark">${edgeLeft}</div>
            ${cellsHtml}
            <div class="edge-mark">${edgeRight}</div>
          </div>
        </div>`;
    }).join('');

    row.innerHTML = `
      <div class="line-top">
        <input class="label" placeholder="1)" value="${escapeHtml(line.label)}" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
        <div class="spacer"></div>
        <button class="btn small" data-act="dup">⧉ Duplicate</button>
        <button class="btn small danger" data-act="del">✕ Remove line</button>
      </div>
      ${rowsHtml}
      <div class="preview"></div>
    `;
    host.appendChild(row);

    const labelInput = row.querySelector('.label');
    labelInput.oninput = e=>{ line.label = e.target.value; queueSave(); updatePreview(row, line, noSahitya, cfg, kalai); };
    row.querySelector('[data-act="dup"]').onclick = ()=>{
      sec.lines.splice(li+1, 0, JSON.parse(JSON.stringify(line))); queueSave(); renderSections();
    };
    row.querySelector('[data-act="del"]').onclick = ()=>{
      sec.lines.splice(li,1); queueSave(); renderSections();
    };

    row.querySelectorAll('.phys-row').forEach(physEl=>{
      const ri = Number(physEl.dataset.ri);
      const r = line.rows[ri];
      const swaraInputs = physEl.querySelectorAll('input.swara');
      const lyricInputs = physEl.querySelectorAll('input.lyric');
      swaraInputs.forEach((inp,i)=>{
        if(r.swara[i] && r.swara[i] !== r.swara[i].toUpperCase()) r.swara[i] = r.swara[i].toUpperCase();
        inp.value = r.swara[i];
        const cap = cfg.rowCells[i];
        const cellDiv = inp.closest('.beat-cell');
        updateAksharaBadge(cellDiv, r.swara[i], cap);
        if(!noSahitya) updateAlignBadge(cellDiv, r.swara[i], r.lyric[i]);
        inp.oninput = e=>{
          r.swara[i] = sanitizeSwaraLive(inp);
          updateAksharaBadge(cellDiv, r.swara[i], cap);
          if(!noSahitya) updateAlignBadge(cellDiv, r.swara[i], r.lyric[i]);
          queueSave(); updatePreview(row, line, noSahitya, cfg, kalai);
        };
      });
      lyricInputs.forEach((inp,i)=>{
        if(r.lyric[i] && r.lyric[i] !== r.lyric[i].toLowerCase()) r.lyric[i] = r.lyric[i].toLowerCase();
        inp.value = r.lyric[i];
        const cellDiv = inp.closest('.beat-cell');
        inp.oninput = e=>{
          r.lyric[i] = sanitizeLyricCellLive(inp);
          updateAlignBadge(cellDiv, r.swara[i], r.lyric[i]);
          queueSave(); updatePreview(row, line, noSahitya, cfg, kalai);
        };
      });
      wireCellNavigation(swaraInputs, lyricInputs);
    });

    updatePreview(row, line, noSahitya, cfg, kalai);
  });
}

/* Builds one physical row's notation grid as a real HTML <table> — mirroring
   dBuildLineTable's structure exactly (same fixed per-cell widths, same
   divider placement, same character-spacing stretch), just in pt instead of
   dxa. This is the single renderer shared by the mini live preview and the
   full Preview modal — so neither can ever again drift from what the actual
   .docx export produces. tableClass picks the color theme ('grid-table-dark'
   for the in-editor live preview, 'grid-table-doc'
   for the full preview/print, which are on light backgrounds). */
function buildGridRowsHTML(cfg, line, kalai, noSahitya, tableClass){
  const numRows = numRowsForLine(cfg, kalai);
  let out = '';
  for(let ri=0; ri<numRows; ri++){
    const r = line.rows[ri] || { swara:[], lyric:[] };
    const edgeLeft = ri===0, edgeRight = ri===numRows-1;
    const colWidths = [GRID_LABEL_W];
    let swaraRow = `<td class="grid-label-cell">${ri===0 && line.label ? escapeHtml(line.label) : ''}</td>`;
    let lyricRow = `<td class="grid-label-cell"></td>`;

    cfg.rowCells.forEach((cap, i)=>{
      const { swaraCols, lyricCols } = buildAlignedColumns(r.swara[i]||'', noSahitya ? '' : (r.lyric[i]||''));
      const isEdgeL = edgeLeft && i===0;
      const isEdgeR = edgeRight && i===cfg.rowCells.length-1;
      const width = cap * GRID_CELL_UNIT;
      const contentLen = swaraCols.reduce((a,c)=>a + c.text.length, 0);
      const spacing = computeCellSpacing(contentLen, width);
      const spacingCss = spacing ? `letter-spacing:${dxaToPt(spacing)}pt;` : '';

      let swaraHtml = '';
      swaraCols.forEach(c=>{
        const esc = escapeHtml(c.text);
        if(c.underline===1) swaraHtml += `<span class="ul-sgl">${esc}</span>`;
        else if(c.underline===2) swaraHtml += `<span class="ul-dbl">${esc}</span>`;
        else swaraHtml += esc;
      });
      if(isEdgeL) swaraHtml = escapeHtml(GRID_EDGE + ' ') + swaraHtml;
      // Second (or later) physical row's first cell — e.g. the start of the
      // 2nd half-avartanam in a 2-kalai line — isn't the line's true left
      // edge, so no real "‖" here, but it still needs to start 2 characters
      // in (same width as "‖ ") to line up vertically with row 0's first
      // cell above it. Kept in sync with the identical fix in both docx
      // exporters.
      const needsAlignPlaceholder = ri > 0 && i === 0 && !isEdgeL;
      if(needsAlignPlaceholder) swaraHtml = '  ' + swaraHtml;
      if(isEdgeR) swaraHtml = swaraHtml + escapeHtml(GRID_EDGE);
      colWidths.push(width);
      swaraRow += `<td class="grid-beat-cell" style="width:${dxaToPt(width)}pt;${spacingCss}">${swaraHtml || '&nbsp;'}</td>`;

      if(!noSahitya){
        let lyricText = lyricCols.join('');
        if(isEdgeL) lyricText = '  ' + lyricText;
        else if(needsAlignPlaceholder) lyricText = '  ' + lyricText;
        if(isEdgeR) lyricText = lyricText + '  ';
        lyricRow += `<td class="grid-beat-cell" style="width:${dxaToPt(width)}pt;${spacingCss}">${lyricText.trim() ? escapeHtml(lyricText) : '&nbsp;'}</td>`;
      }

      if(i === cfg.dividerAfter && i !== cfg.rowCells.length-1){
        colWidths.push(GRID_DIV_W);
        const glyph = cfg.dividerType === 'pipe' ? GRID_PIPE_DIV : GRID_AVART_DIV;
        swaraRow += `<td class="grid-div-cell" style="width:${dxaToPt(GRID_DIV_W)}pt;">${escapeHtml(glyph)}</td>`;
        if(!noSahitya) lyricRow += `<td class="grid-div-cell" style="width:${dxaToPt(GRID_DIV_W)}pt;"></td>`;
      }
    });

    out += `<table class="${tableClass}"><colgroup>${colWidths.map(w=>`<col style="width:${dxaToPt(w)}pt;">`).join('')}</colgroup>`
         + `<tr class="swara-row">${swaraRow}</tr>`
         + (noSahitya ? '' : `<tr class="lyric-row">${lyricRow}</tr>`)
         + `</table>`;

    // Small gap between the two half-avartanam tables of a 2-kalai line —
    // matches dHalfRowSpacer's intent: noticeably tighter than the gap
    // between different lines, so the two halves still read as one line.
    if(ri < numRows - 1) out += `<div class="grid-half-gap"></div>`;
  }
  return out;
}

function updatePreview(rowEl, line, noSahitya, cfg, kalai){
  const prev = rowEl.querySelector('.preview');
  prev.innerHTML = buildGridRowsHTML(cfg, line, kalai, noSahitya, 'grid-table-dark');
}

/* ===================== Full-document Preview ===================== */
/* Renders an HTML approximation of the actual exported document: title,
   metadata block (with the confirmed spacing), plain-lyric sections, notated
   sections (with a blank row after each heading, per-token alignment, and the
   2-word Pallavi reference note), and the closing marker. */
function buildFullPreviewHTML(song){
  const cfg = TALAS[song.tala] || TALAS.adi;
  const kalai = song.kalai || 1;
  const talaLabel = cfg.kalaiAware ? `${cfg.label}${kalai===2?' (2 kalai)':''}` : cfg.label;
  const derived = derivedPallaviOpening(song);

  let h = '';
  h += `<div class="doc-title">${escapeHtml(song.title||'Untitled Kriti')}</div>`;
  h += `<div class="doc-blank"></div>`;
  h += `<div class="doc-meta"><b>Raga:</b> ${escapeHtml(ragaDisplay(song))}</div>`;
  h += `<div class="doc-blank"></div>`;
  h += `<div class="doc-meta"><b>Arohana:</b> ${escapeHtml(song.arohanam)}</div>`;
  h += `<div class="doc-meta"><b>Avarohana:</b> ${escapeHtml(song.avarohanam)}</div>`;
  h += `<div class="doc-blank"></div>`;
  h += `<div class="doc-meta"><b>Tala:</b> ${escapeHtml(talaLabel)}</div>`;
  h += `<div class="doc-meta"><b>Composer:</b> ${escapeHtml(song.composer)}</div>`;
  h += `<div class="doc-blank"></div>`;

  song.sections.forEach(sec=>{
    if(sec.noSahitya) return;
    h += `<div class="doc-heading">${escapeHtml(sec.name)}</div>`;
    (sec.sahitya||'').split('\n').forEach(ln=> h += `<div class="doc-lyric-line">${escapeHtml(ln)||'&nbsp;'}</div>`);
    h += `<div class="doc-blank"></div>`;
  });

  song.sections.forEach((sec, si)=>{
    h += `<div class="doc-heading">${escapeHtml(sec.name)}:</div>`;
    h += `<div class="doc-blank"></div>`;
    sec.lines.forEach(line=>{
      h += buildGridRowsHTML(cfg, line, kalai, sec.noSahitya, 'grid-table-doc');
      h += `<div class="doc-blank"></div>`;
    });
    h += `<div class="doc-blank"></div>`;
    if(si !== 0 && sec.showPallaviRef){
      const text = sec.pallaviOverride && sec.pallaviOverride.trim() ? sec.pallaviOverride.trim() : derived;
      if(text){
        h += `<div class="doc-refnote">(${escapeHtml(text)})</div>`;
        h += `<div class="doc-blank"></div>`;
      }
    }
  });

  h += `<div class="doc-blank"></div><div class="doc-blank"></div>`;
  h += `<div class="doc-end">**********</div>`;
  return h;
}

function openPreview(){
  const song = getSong();
  if(!song) return;
  document.getElementById('previewBody').innerHTML = buildFullPreviewHTML(song);
  document.getElementById('previewOverlay').classList.add('show');
}
function closePreview(){
  document.getElementById('previewOverlay').classList.remove('show');
}

/* ===================== In-browser .docx export ===================== */
/* Ported 1:1 from the verified Node generator. Reuses TALAS, octaveDisplay,
   buildAlignedColumns, ragaDisplay, and derivedPallaviOpening already defined
   above so this can never silently drift out of sync with the app's own rules. */
function ensureDocxLib(){
  if(typeof window.docx === 'undefined'){
    showToast('Word-export library failed to load — check your connection and reload the page.');
    return null;
  }
  return window.docx;
}

/* ===================== Shared grid layout constants ===================== */
/* Single source of truth for the notation grid's physical layout — used
   identically by the docx exporter AND the HTML preview/print renderer, so
   the two can never silently drift apart (that drift was the root cause of
   the missing-divider / wrong-width bug). All widths are in dxa (twips,
   1/20 pt) to match Word's native unit; the HTML renderer converts to pt
   (dxa/20) for CSS, which is a lossless, exact conversion. */
const GRID_FONT = 'Consolas';
const GRID_SZ = 20; // 10pt, in half-points (Word's TextRun.size unit)
const SHEET_SZ = 22; // 11pt
const GRID_EDGE = '\u2551', GRID_AVART_DIV = '\u2551', GRID_PIPE_DIV = '|';
const GRID_LABEL_W = 567, GRID_DIV_W = 389;
const GRID_CELL_UNIT = 470; // dxa per akshara of cell capacity — content-independent
/* Point 3: per-cell character spacing, so a tight/underlined cell (few
   characters) doesn't look empty next to a fixed-width box sized for the
   tala's full capacity. Word's "Expanded" character spacing (and CSS
   letter-spacing, its exact visual equivalent) adds space after every glyph
   without inserting real space characters, so it can't affect the tokenizer,
   spacing rules, or alignment — purely cosmetic stretch to fill the box. */
const GRID_CHAR_WIDTH_TWIPS = 120; // ~0.6em advance width for Consolas at 10pt
const GRID_MAX_CHAR_SPACING_TWIPS = 60;
function computeCellSpacing(contentLen, targetWidthTwips){
  if(contentLen <= 0) return 0;
  const naturalWidth = contentLen * GRID_CHAR_WIDTH_TWIPS;
  const extra = (targetWidthTwips - naturalWidth) / contentLen;
  return Math.max(0, Math.min(GRID_MAX_CHAR_SPACING_TWIPS, Math.round(extra)));
}
const dxaToPt = dxa => dxa / 20;

async function downloadDocxFile(song){
  const lib = ensureDocxLib();
  if(!lib) return;
  const {
    Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
    WidthType, AlignmentType, BorderStyle, VerticalAlign, UnderlineType, TableLayoutType,
    Tab, TabStopType
  } = lib;

  const FONT_D = GRID_FONT;
  const SZ_D = SHEET_SZ, GRID_SZ_D = GRID_SZ;
  const EDGE_D = GRID_EDGE, AVART_DIV_D = GRID_AVART_DIV, PIPE_DIV_D = GRID_PIPE_DIV;
  const LABEL_W_D = GRID_LABEL_W, DIV_W_D = GRID_DIV_W;

  function underlineProp(level){
    if(level === 1) return { type: UnderlineType.SINGLE };
    if(level === 2) return { type: UnderlineType.DOUBLE };
    return undefined;
  }
  function drun(text, opts={}){
    return new TextRun({
      text, font: FONT_D, size: opts.size || SZ_D, bold: !!opts.bold,
      underline: opts.underline ? {} : (opts.underlineLevel ? underlineProp(opts.underlineLevel) : undefined),
      color: '000000',
      characterSpacing: opts.spacing || undefined,
    });
  }
  /* The closing "‖" of a row must sit at the true right edge of its cell no
     matter how little (or much) content precedes it — a plain appended run
     just trails after the text, wherever that happens to end. Instead, this
     inserts a real Word tab character (w:tab), paired with a right-aligned
     tab stop set at exactly the cell's width (see dBeatPara below) — the tab
     jumps straight to that position, so "‖" always lands flush at the cell
     boundary regardless of the cell's actual content length. Kept in sync
     with the identical fix in kriti-docx-generator.js. */
  function dTabThenRun(text, opts={}){
    return new TextRun({
      children: [new Tab(), text],
      font: FONT_D, size: opts.size || SZ_D, bold: !!opts.bold,
      underline: opts.underline ? {} : (opts.underlineLevel ? underlineProp(opts.underlineLevel) : undefined),
      color: '000000',
    });
  }
  /* Point 3: per-cell character spacing — uses the shared computeCellSpacing
     defined at top level, so this can never drift from the preview/print
     renderer's own use of the exact same function. */
  function dPlainPara(text, opts={}){
    return new Paragraph({
      alignment: opts.center ? AlignmentType.CENTER : undefined,
      spacing: { after: opts.after !== undefined ? opts.after : 0 },
      // Always carry a real run, even when text is '' — an empty Paragraph with
      // no children falls back to Word's default line-height instead of the
      // sheet's font/size, so blank spacer rows can render visibly thinner than
      // a real row.
      children: [drun(text, opts)],
    });
  }
  /* Half-height blank spacer, used to build a "1.5 row" gap: a full dPlainPara('')
     row plus one of these gives ~1.5 rows without guessing exact twip values. */
  function dHalfRowSpacer(size){
    return new Paragraph({
      spacing: { after: 0 },
      children: [drun('', { size: Math.round((size || SZ_D) / 2) })],
    });
  }
  function dMetaLine(label, value){
    return new Paragraph({ spacing:{after:0}, children:[drun(label+':',{bold:true}), drun(' '+(value||''))] });
  }
  function dSectionHeading(name, withColon){
    return new Paragraph({ spacing:{after:0}, children:[drun(name+(withColon?':':''), {bold:true, underline:true})] });
  }
  const NOBORDER_D = { style: BorderStyle.NONE, size:0, color:'FFFFFF' };
  const CELL_BORDERS_D = { top:NOBORDER_D, bottom:NOBORDER_D, left:NOBORDER_D, right:NOBORDER_D };
  function dCell(children, widthDxa){
    return new TableCell({ width:{size:widthDxa,type:WidthType.DXA}, verticalAlign:VerticalAlign.CENTER, borders:CELL_BORDERS_D, children });
  }
  function dBeatPara(children, tabStops){
    return new Paragraph({ alignment: AlignmentType.LEFT, spacing:{after:0}, tabStops, children });
  }

  function dBuildLineTable(cfg, line, kalai, noSahitya){
    const numRows = numRowsForLine(cfg, kalai);
    const rowsOut = [];
    // Fixed width per akshara of cell capacity — deterministic, content-independent,
    // so every table for a given tala is exactly the same width throughout the
    // whole document (matches the reference template; content only ever affects
    // spacing within a cell, never the cell's box size).
    // Uses the shared GRID_CELL_UNIT constant (defined at top level) so this
    // can never drift from the preview/print renderer's own cell widths.
    for(let ri=0; ri<numRows; ri++){
      const r = line.rows[ri] || { swara:[], lyric:[] };
      const swaraCells=[], lyricCells=[], cellWidths=[];
      const edgeLeft = ri===0, edgeRight = ri===numRows-1;

      swaraCells.push(dCell([dBeatPara(ri===0 && line.label ? [drun(line.label,{bold:true,size:GRID_SZ_D})] : [])], LABEL_W_D));
      if(!noSahitya) lyricCells.push(dCell([dBeatPara([])], LABEL_W_D));

      cfg.rowCells.forEach((cap,i)=>{
        const { swaraCols, lyricCols } = buildAlignedColumns(r.swara[i]||'', noSahitya ? '' : (r.lyric[i]||''));
        const isEdgeL = edgeLeft && i===0;
        const isEdgeR = edgeRight && i===cfg.rowCells.length-1;
        const width = cap * GRID_CELL_UNIT;
        const contentLen = swaraCols.reduce((a,c)=>a + c.text.length, 0);
        const spacing = computeCellSpacing(contentLen, width);
        const children = [];
        // Each token's text already carries its full, correctly-computed
        // trailing gap (baked in by buildAlignedColumns) — direct
        // concatenation, no extra boundary space needed or added here.
        swaraCols.forEach(c=>{
          children.push(drun(c.text, {underlineLevel:c.underline, size:GRID_SZ_D, spacing}));
        });
        // The second (or later) physical row's first cell — e.g. the start of
        // the 2nd half-avartanam in a 2-kalai line — is NOT the line's true
        // left edge, so it never gets a real "‖". But without correction its
        // content would start 2 characters further left than row 0's first
        // cell (which carries "‖ "), throwing off vertical alignment between
        // the two half-avartanam rows. Reserve the same 2-character width
        // here, invisibly (plain spaces, no "‖" glyph), purely so the
        // swara/sahitya line up with the row above. Kept in sync with the
        // identical fix in kriti-docx-generator.js.
        const needsAlignPlaceholder = ri > 0 && i === 0 && !isEdgeL;
        if(isEdgeL) children.unshift(drun(EDGE_D+' ', {size:GRID_SZ_D}));
        else if(needsAlignPlaceholder) children.unshift(drun('  ', {size:GRID_SZ_D}));
        if(isEdgeR) children.push(dTabThenRun(EDGE_D, {size:GRID_SZ_D}));
        swaraCells.push(dCell([dBeatPara(children, isEdgeR ? [{type: TabStopType.RIGHT, position: width}] : undefined)], width));
        if(!noSahitya){
          // Direct concatenation (not join(' ')) — each lyric column now
          // carries the exact same gap as its corresponding swara column,
          // so an extra separator space here would break that mirroring.
          let lyricText = lyricCols.join('');
          if(isEdgeL) lyricText = '  ' + lyricText;
          else if(needsAlignPlaceholder) lyricText = '  ' + lyricText;
          if(isEdgeR) lyricText = lyricText + '  ';
          lyricCells.push(dCell([dBeatPara(lyricText.trim() ? [drun(lyricText,{size:GRID_SZ_D, spacing})] : [])], width));
        }
        cellWidths.push(width);
        if(i === cfg.dividerAfter && i !== cfg.rowCells.length-1){
          swaraCells.push(dCell([dBeatPara([drun(cfg.dividerType === 'pipe' ? PIPE_DIV_D : AVART_DIV_D,{size:GRID_SZ_D})])], DIV_W_D));
          if(!noSahitya) lyricCells.push(dCell([dBeatPara([])], DIV_W_D));
          cellWidths.push(DIV_W_D);
        }
      });

      const colWidths = [LABEL_W_D, ...cellWidths];
      const tableRows = [ new TableRow({children:swaraCells}) ];
      if(!noSahitya) tableRows.push(new TableRow({children:lyricCells}));
      rowsOut.push(new Table({
        width: { size: colWidths.reduce((a,b)=>a+b,0), type: WidthType.DXA },
        columnWidths: colWidths,
        layout: TableLayoutType.FIXED,
        borders: { top:NOBORDER_D, bottom:NOBORDER_D, left:NOBORDER_D, right:NOBORDER_D, insideHorizontal:NOBORDER_D, insideVertical:NOBORDER_D },
        rows: tableRows,
      }));

      // Small gap between the two half-avartanam tables of a 2-kalai line — kept
      // noticeably tighter than the full blank row used between different lines,
      // so the two halves still read as one continuous line rather than two
      // separate ones, while no longer sitting flush against each other.
      if(ri < numRows - 1){
        rowsOut.push(dHalfRowSpacer());
      }
    }
    return rowsOut;
  }

  function dBuildDocBody(song){
    const cfg = TALAS[song.tala] || TALAS.adi;
    const kalai = song.kalai || 1;
    const talaLabel = cfg.kalaiAware ? `${cfg.label}${kalai===2?' (2 kalai)':''}` : cfg.label;
    const body = [];

    body.push(new Paragraph({ alignment: AlignmentType.CENTER, children:[drun(song.title||'Untitled Kriti', {bold:true, underline:true})] }));
    body.push(dPlainPara(''));
    body.push(dHalfRowSpacer());
    body.push(dMetaLine('Raga', ragaDisplay(song)));
    body.push(dPlainPara(''));
    body.push(dMetaLine('Arohana', song.arohanam));
    body.push(dMetaLine('Avarohana', song.avarohanam));
    body.push(dPlainPara(''));
    body.push(dMetaLine('Tala', talaLabel));
    body.push(dMetaLine('Composer', song.composer));
    body.push(dPlainPara(''));

    song.sections.forEach(sec=>{
      if(sec.noSahitya) return;
      body.push(dSectionHeading(sec.name, false));
      (sec.sahitya||'').split('\n').forEach(ln=>body.push(dPlainPara(ln)));
      body.push(dPlainPara(''));
    });

    const derivedOpening = derivedPallaviOpening(song);

    song.sections.forEach((sec, si)=>{
      body.push(dSectionHeading(sec.name, true));
      body.push(dPlainPara(''));
      sec.lines.forEach(line=>{
        dBuildLineTable(cfg, line, kalai, sec.noSahitya).forEach(t=>body.push(t));
        body.push(dPlainPara(''));
      });
      if(si !== 0 && sec.showPallaviRef){
        const text = sec.pallaviOverride && sec.pallaviOverride.trim() ? sec.pallaviOverride.trim() : derivedOpening;
        if(text){
          body.push(dPlainPara(`(${text})`, {bold:true}));
          body.push(dPlainPara(''));
        }
      }
    });

    body.push(dPlainPara(''));
    body.push(dPlainPara(''));
    body.push(dPlainPara('**********', {center:true}));
    return body;
  }

  try{
    // Legal-length landscape (14in) fits every tala EXCEPT Adi (Tishra Nadai) —
    // its 48 aksharas/row (vs Adi's 32) need ~17.5in of usable width at the
    // current 10pt grid font, so only that tala gets a further-widened page.
    const pageWidth = song.tala === 'adi_tishra' ? 25920 : 20160; // 18in vs 14in
    const doc = new Document({
      sections: [{
        properties: { page: { size:{width:pageWidth,height:12240}, margin:{top:1008,bottom:720,left:1008,right:720} } },
        children: dBuildDocBody(song),
      }],
    });
    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const filename = (song.title || 'kriti').replace(/[\\/:*?"<>|]/g,'_') + '.docx';
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast('Downloaded .docx');
    syncDocxToDrive(blob, filename);
  }catch(e){
    console.error(e);
    showToast('Could not generate .docx — see console for details');
  }
}

/* ===================== Actions ===================== */
function deleteSong(id){
  if(!confirm('Delete this kriti from your library? This cannot be undone.')) return;
  const song = library.find(s=>s.id===id);
  library = library.filter(s=>s.id!==id);
  currentId = library.length ? library[0].id : null;
  persist(); renderAll();
  showToast('Deleted');
  // Also removes the matching .docx from Drive (queued + retried — see
  // flushPendingDriveDeletes — so this isn't lost if you're offline or not
  // currently connected right when you delete something).
  if(song){
    const filename = (song.title || 'kriti').replace(/[\\/:*?"<>|]/g,'_') + '.docx';
    queueDriveDelete(filename);
  }
}

function copyForClaude(song){
  const payload = Object.assign({}, song, {
    derivedPallaviOpening: derivedPallaviOpening(song),
    endMarker: true
  });
  const text = JSON.stringify(payload, null, 2);
  navigator.clipboard.writeText(text).then(()=>{
    showToast('Copied — paste this to Claude along with the source PDF to get your .docx');
  }).catch(()=> showToast('Could not copy — select and copy manually'));
}

/* ===================== Boot ===================== */
async function renderAll(){
  renderSongList();
  renderMain();
}

document.getElementById('syncBtn').onclick = onSyncButtonClick;
document.getElementById('newSongBtn').onclick = ()=>{
  const s = newSong();
  library.unshift(s);
  currentId = s.id;
  persist();
  renderAll();
};
document.getElementById('searchBox').oninput = renderSongList;
document.getElementById('closePreviewBtn').onclick = closePreview;
document.getElementById('previewOverlay').addEventListener('click', e=>{
  if(e.target.id === 'previewOverlay') closePreview();
});
document.getElementById('storageQuotaBtn').onclick = openStorageQuota;
document.getElementById('closeQuotaBtn').onclick = closeStorageQuota;
document.getElementById('quotaOverlay').addEventListener('click', e=>{
  if(e.target.id === 'quotaOverlay') closeStorageQuota();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ closePreview(); closeStorageQuota(); }
});

(async function init(){
  await loadLibrary();
  if(library.length) currentId = library[0].id;
  renderAll();
  updateSyncButton();
  // Automatically prompt to connect to Google Drive on every fresh app open
  // (the access token is memory-only, so this is always needed after a
  // reload). NOTE: this opens the Google account-chooser as a popup, and
  // most browsers block popups that aren't the direct result of a user
  // click — so this can be silently blocked depending on the browser. If
  // that happens, the "Connect to Drive" button is still right there as a
  // normal, always-working fallback; nothing else depends on this succeeding.
  if(!driveAccessToken) connectDrive();
})();
</script>
