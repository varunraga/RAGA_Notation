<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kriti Notation Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --leaf:#ececeb;
    --leaf-deep:#e0e0de;
    --ink:#1a1a2e;
    --ink-soft:#5c5f6e;
    --maroon:#4a4aef;
    --maroon-deep:#2e2ecc;
    --gold:#8f8fff;
    --line:#ddd9d0;
    --panel:#faf9f5;
    --paper:#ffffff;
    --good:#3b6d11;
    --warn:#b23a3a;
    --warn-deep:#8f2c2c;
    --heading:#000000; /* app name, song title, section labels, card headings, preview modal title */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--leaf);
    background-image:
      radial-gradient(circle at 10% 10%, rgba(74,74,239,0.045), transparent 40%),
      radial-gradient(circle at 90% 30%, rgba(74,74,239,0.035), transparent 45%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .app{ display:grid; grid-template-columns:280px 1fr; min-height:100vh; }

  /* Tablet: sidebar collapses above content but keeps a bounded, scrollable height
     instead of the old 100vh (which pushed the whole page down on mobile). */
  @media (max-width:900px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ position:static; height:auto; max-height:320px; border-right:none; border-bottom:1px solid var(--line); }
    .main{ padding:24px 20px 60px; max-width:100%; }
    .hero h1{ font-size:28px; }
  }

  /* Phone: tighter paddings, smaller type, single-column fields, buttons stay tappable. */
  @media (max-width:600px){
    .sidebar{ padding:16px 12px; max-height:220px; gap:10px; }
    .brand .mark{ font-size:21px; }
    .newbtn{ padding:12px; font-size:14px; }
    .main{ padding:16px 12px 50px; }
    .hero{ margin-bottom:18px; }
    .hero h1{ font-size:23px; }
    .hero p{ font-size:12.5px; }
    .toolbar{ gap:6px; }
    .toolbar .btn{ font-size:12.5px; padding:10px 12px; }
    .card{ padding:16px 14px; }
    .beat-cell{ min-width:54px; }
    .line-top{ gap:6px; }
    .aksh-badge{ font-size:9px; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:22px 16px;
    display:flex; flex-direction:column; gap:14px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; padding:0 4px 10px; border-bottom:1px solid var(--line); margin-bottom:4px;}
  .brand .mark{ font-family:'Inter',sans-serif; font-weight:600; font-size:26px; color:var(--heading); letter-spacing:.3px; }
  .brand .sub{ font-size:11px; text-transform:uppercase; letter-spacing:1.6px; color:var(--ink-soft); }
  .newbtn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--maroon); color:var(--paper); border:none; border-radius:8px;
    padding:11px 12px; font-size:13.5px; font-weight:600; cursor:pointer; letter-spacing:.2px;
    transition:background .15s;
  }
  .newbtn:hover{ background:var(--maroon-deep); }
  .sync-panel{ display:flex; flex-direction:column; gap:7px; }
  .sync-panel .btn{ width:100%; }
  .sync-status{
    text-align:center; font-size:10.5px; line-height:1.35; color:var(--ink-soft);
    min-height:13px; padding:0 4px;
  }
  .search{
    width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--line);
    background:var(--paper); font-size:13px; color:var(--ink); font-family:'Inter',sans-serif;
  }
  .song-list{ display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .song-item{
    padding:10px 12px; border-radius:8px; cursor:pointer; border:1px solid transparent;
    display:flex; flex-direction:column; gap:2px;
  }
  .song-item:hover{ background:var(--leaf-deep); }
  .song-item.active{ background:var(--paper); border-color:var(--gold); box-shadow:0 1px 0 rgba(0,0,0,0.03); }
  .song-item .t{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .song-item .m{ font-size:11px; color:var(--ink-soft); }
  .empty-note{ font-size:12.5px; color:var(--ink-soft); padding:8px 4px; line-height:1.5; }

  /* ---------- Main ---------- */
  .main{ padding:32px 40px 80px; max-width:980px; }

  .hero{
    display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:28px; flex-wrap:wrap;
  }
  .hero h1{ font-family:'Inter',sans-serif; font-weight:600; font-size:34px; margin:0; color:var(--heading); }
  .hero p{ margin:4px 0 0; color:var(--ink-soft); font-size:13.5px; }

  .placeholder{
    background:var(--paper); border:1px dashed var(--line); border-radius:14px;
    padding:60px 30px; text-align:center; color:var(--ink-soft);
  }
  .placeholder .glyph{ font-size:38px; color:var(--gold); margin-bottom:10px; font-family:'Inter',sans-serif; }
  .placeholder h2{ font-family:'Inter',sans-serif; color:var(--ink); font-weight:600; margin:0 0 8px; }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:24px 26px; margin-bottom:20px; box-shadow:0 1px 2px rgba(44,32,19,0.04);
  }
  .card h3{
    font-family:'Inter',sans-serif; font-size:19px; font-weight:600; margin:0 0 14px;
    color:var(--heading); display:flex; align-items:center; gap:8px;
  }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:700px){ .field-grid{ grid-template-columns:1fr; } }
  label{ font-size:11.5px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:5px; }
  input[type=text], select, textarea{
    width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel); font-size:14px; color:var(--ink); font-family:'Inter',sans-serif;
  }
  textarea{ font-family:'Courier Prime',monospace; font-size:13.5px; line-height:1.7; resize:vertical; min-height:70px; }
  .fieldwrap{ margin-bottom:12px; }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px; transition:all .15s;
  }
  .btn:hover{ border-color:var(--gold); background:var(--leaf-deep); }
  .btn.primary{ background:var(--maroon); color:var(--paper); border-color:var(--maroon); }
  .btn.primary:hover{ background:var(--maroon-deep); }
  .btn.danger{ color:var(--warn); }
  .btn.danger:hover{ background:#f7e6e6; border-color:var(--warn); }
  .btn.small{ padding:6px 10px; font-size:12px; }

  .section-block{ border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .section-head input{ font-family:'Inter',sans-serif; font-size:19px; font-weight:600; color:var(--heading); border:none; background:transparent; padding:2px 4px; }
  .section-head input:focus{ outline:1px solid var(--gold); border-radius:5px; }

  .line-row{ margin-bottom:16px; padding:12px; background:var(--panel); border-radius:10px; border:1px solid var(--line); }
  .line-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .line-top input.label{ width:56px; font-weight:700; font-family:'Courier Prime',monospace; text-align:center; padding:6px 4px;}
  .line-top .spacer{ flex:1; }

  .grid-wrap{ overflow-x:auto; }
  .beat-grid{ display:grid; gap:4px; align-items:stretch; min-width:max-content; }
  .beat-cell{ display:flex; flex-direction:column; gap:4px; min-width:64px; }
  .beat-cell input{
    font-family:'Courier Prime',monospace; font-size:14px; text-align:left;
    padding:7px 6px; border-radius:5px;
  }
  .beat-cell input.swara{ background:var(--paper); border:1px solid var(--line); font-weight:700; }
  .beat-cell input.lyric{ background:#fff; border:1px solid #e3dfd3; font-size:12px; color:var(--ink-soft); }
  .aksh-badge{ font-size:9.5px; text-align:center; height:12px; line-height:12px; font-weight:700; letter-spacing:.3px; }
  .aksh-badge.ok{ color:var(--good); }
  .aksh-badge.bad{ color:var(--warn); }
  .align-badge{ font-size:8.5px; text-align:left; min-height:11px; line-height:11px; font-weight:700; color:var(--warn); letter-spacing:.2px; }
  .sep-cell{ display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:20px; font-weight:700; padding:0 2px; }
  .edge-mark{ display:flex; align-items:center; justify-content:center; color:var(--maroon); font-size:20px; font-weight:700; padding:0 4px; }

  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.6; }
  .hint code{ background:var(--leaf-deep); padding:1px 5px; border-radius:4px; font-family:'Courier Prime',monospace; }

  .preview{
    font-family:'Consolas','Courier Prime',monospace; background:var(--ink); color:var(--leaf);
    border-radius:10px; padding:16px 18px; font-size:14px; line-height:2; overflow-x:auto; margin-top:14px;
  }
  /* ---------- Notation grid tables (shared by live preview and the full
     Preview modal — mirrors the .docx export's real table structure:
     fixed per-cell widths, an explicit divider cell, Consolas font. ---------- */
  .grid-table-dark, .grid-table-doc{ border-collapse:collapse; table-layout:fixed; font-family:'Consolas','Courier Prime',monospace; }
  .grid-table-dark{ margin:2px 0; }
  .grid-table-doc{ margin:1px 0; }
  .grid-table-dark td, .grid-table-doc td{ padding:0 1px; vertical-align:middle; white-space:pre; overflow:visible; }
  .grid-table-dark .grid-label-cell, .grid-table-doc .grid-label-cell{ font-weight:700; }
  .grid-table-dark .grid-div-cell, .grid-table-doc .grid-div-cell{ text-align:center; font-weight:700; }
  .grid-table-dark .swara-row td{ color:#ececeb; font-weight:700; font-size:14px; }
  .grid-table-dark .lyric-row td{ color:#a8acbf; font-size:12.5px; font-weight:400; }
  .grid-table-doc .swara-row td{ color:#111; font-weight:700; font-size:12.5px; }
  .grid-table-doc .lyric-row td{ color:#444; font-size:11px; font-weight:400; }
  .grid-table-dark .swara-row .ul-sgl, .grid-table-dark .swara-row .ul-dbl{ text-decoration-color:#8484ff; text-decoration-thickness:2px; }
  .grid-table-dark .swara-row .ul-sgl, .grid-table-doc .swara-row .ul-sgl{ text-decoration:underline; }
  .grid-table-dark .swara-row .ul-dbl, .grid-table-doc .swara-row .ul-dbl{ text-decoration:underline; text-decoration-style:double; }
  .grid-half-gap{ height:6px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--leaf); padding:11px 20px; border-radius:9px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .25s; z-index:50; font-weight:600;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .add-line-btn{ display:flex; align-items:center; gap:6px; }

  /* ---------- Preview modal ---------- */
  .preview-overlay{
    position:fixed; inset:0; background:rgba(44,32,19,0.55); z-index:100;
    display:none; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;
  }
  .preview-overlay.show{ display:flex; }
  .preview-modal{
    background:#fffef9; border-radius:14px; max-width:1000px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.35); overflow:hidden;
  }
  .preview-modal-head{
    padding:18px 26px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .preview-modal-title{ font-family:'Inter',sans-serif; font-weight:600; font-size:20px; color:var(--heading); }
  .preview-modal-sub{ font-size:12px; color:var(--ink-soft); flex:1; }
  .preview-modal-body{ padding:30px 36px 50px; overflow-x:auto; }

  .doc-title{ font-family:'Consolas','Courier Prime',monospace; font-weight:700; text-decoration:underline; text-align:center; font-size:15px; color:#111; }
  .doc-meta{ font-family:'Consolas','Courier Prime',monospace; font-size:13.5px; color:#111; }
  .doc-meta b{ font-weight:700; }
  .doc-blank{ height:16px; }
  .doc-heading{ font-family:'Consolas','Courier Prime',monospace; font-weight:700; text-decoration:underline; font-size:13.5px; color:#111; }
  .doc-lyric-line{ font-family:'Consolas','Courier Prime',monospace; font-size:13px; color:#222; }
  .doc-refnote{ font-family:'Consolas','Courier Prime',monospace; font-weight:700; font-size:13px; color:#111; }
  .doc-end{ font-family:'Consolas','Courier Prime',monospace; text-align:center; font-size:13px; color:#111; }
  /* ---------- Storage quota modal ---------- */
  .quota-overlay{
    position:fixed; inset:0; background:rgba(44,32,19,0.55); z-index:110;
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  .quota-overlay.show{ display:flex; }
  .quota-modal{
    background:#fffef9; border-radius:14px; max-width:360px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.35); padding:22px 24px 24px;
  }
  .quota-modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .quota-modal-title{ font-family:'Inter',sans-serif; font-weight:600; font-size:17px; color:var(--heading); }
  .quota-bar-track{ background:var(--line); border-radius:6px; height:10px; overflow:hidden; margin:10px 0 8px; }
  .quota-bar-fill{ background:var(--maroon); height:100%; border-radius:6px; transition:width .3s; }
  .quota-bar-fill.warn{ background:var(--warn); }
  .quota-text{ font-size:13px; color:var(--ink-soft); }
  .quota-text b{ color:var(--ink); }
  .quota-loading, .quota-error{ font-size:13px; color:var(--ink-soft); padding:6px 0; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">Kriti Notation Studio</div>
      <div class="sub">your permanent swara library</div>
    </div>
    <div class="sync-panel">
      <button class="newbtn" id="syncBtn">☁️ Connect to Drive</button>
      <div class="sync-status" id="syncStatus"></div>
      <button class="btn small" id="storageQuotaBtn">📊 Storage used</button>
    </div>
    <button class="newbtn" id="newSongBtn">+ New Kriti</button>
    <input class="search" id="searchBox" type="text" placeholder="Search by title or raga…" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
    <div class="song-list" id="songList"></div>
  </aside>

  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<div class="quota-overlay" id="quotaOverlay">
  <div class="quota-modal">
    <div class="quota-modal-head">
      <div class="quota-modal-title">Google Drive storage</div>
      <button class="btn small" id="closeQuotaBtn">✕</button>
    </div>
    <div id="quotaBody"><div class="quota-loading">Loading…</div></div>
  </div>
</div>


<div class="preview-overlay" id="previewOverlay">
  <div class="preview-modal">
    <div class="preview-modal-head">
      <div class="preview-modal-title">Document Preview</div>
      <div class="preview-modal-sub">Approximation of the exported layout — actual docx/pdf spacing may vary slightly.</div>
      <button class="btn small" id="closePreviewBtn">✕ Close</button>
    </div>
    <div class="preview-modal-body" id="previewBody"></div>
  </div>
</div>

<script>
/* ===================== Data / Tala config ===================== */
// rowCells: akshara-capacity of each cell in ONE printed row.
// For Adi this is a single avartanam (8 cells x 4 = 32 aksharas); Adi is kalai-aware,
// so a "line" may print as 1 row (1 kalai) or 2 stacked rows (2 kalai, 32 each, no edge
// bar between them since it's one continuous 64-akshara avartanam).
// For Rupakam/Khanda/Misra, rowCells already packs 2 full avartanams per row (your
// convention), with a "‖" avartanam-boundary divider mid-row and no "|" ever.
const TALAS = {
  adi: {
    label: 'Adi', rowCells: [4,4,4,4,4,4,4,4],
    dividerType: 'pipe', dividerAfter: 3, kalaiAware: true,
    aksharasPerAvartanam: 32
  },
  adi_tishra: {
    label: 'Adi (Tishra Nadai)', rowCells: [6,6,6,6,6,6,6,6],
    dividerType: 'pipe', dividerAfter: 3, kalaiAware: false,
    aksharasPerAvartanam: 48
  },
  rupakam: {
    label: 'Rupakam', rowCells: [4,4,4,4,4,4],
    dividerType: 'avartanam', dividerAfter: 2, kalaiAware: false,
    aksharasPerAvartanam: 12
  },
  khanda_chapu: {
    label: 'Khanda Chapu', rowCells: [4,6,4,6],
    dividerType: 'avartanam', dividerAfter: 1, kalaiAware: false,
    aksharasPerAvartanam: 10
  },
  misra_chapu: {
    label: 'Misra Chapu', rowCells: [6,4,4,6,4,4],
    dividerType: 'avartanam', dividerAfter: 2, kalaiAware: false,
    aksharasPerAvartanam: 14
  },
};

function numRowsForLine(cfg, kalai){
  return (cfg.kalaiAware && kalai === 2) ? 2 : 1;
}

let library = [];
let currentId = null;

/* ===================== Google Drive sync =====================
   Client-side OAuth via Google Identity Services (GIS), using the drive.file scope
   (the app can only see/manage files it creates itself, never your whole Drive).
   The access token is kept in memory only (a module variable, never written to
   localStorage/cookies) since it's short-lived (~1hr). A proactive silent
   refresh is scheduled ~5 minutes before each expiry (see
   scheduleDriveTokenRefresh), so in normal use the token renews itself in the
   background and you'd rarely ever see a re-auth prompt mid-session. Every
   Drive API call also retries transient failures (dropped connections, 429s,
   5xx) with jittered exponential backoff (see driveFetch) before giving up.

   Sync button behavior: when NOT connected (fresh load, or the token has
   truly expired/gone stale, e.g. the browser session itself was signed out)
   it acts as "Connect to Drive" (interactive consent). Once connected, it
   just means "sync now" — no re-auth prompt. Separately, every edit that
   gets saved locally also triggers a SILENT auto-sync to Drive automatically,
   provided we're connected and the browser reports it's online — no button
   click needed for that part. */
const DRIVE_CLIENT_ID = '1039896529971-206omvkrp0er16kl5lisfns5tu7jhe5r.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'Kriti Notation Studio';
const DRIVE_FOLDER_ID_KEY = 'kriti-notation-studio.driveFolderId';
const DRIVE_LIBRARY_FILE_ID_KEY = 'kriti-notation-studio.driveLibraryFileId';
const DRIVE_LIBRARY_FILENAME = 'kriti-library.json';
const DRIVE_LAST_SYNCED_KEY = 'kriti-notation-studio.driveLastSyncedAt';
const DRIVE_DIRTY_COUNT_KEY = 'kriti-notation-studio.driveDirtyCount';
let driveTokenClient = null;
let driveAccessToken = null;
let driveTokenExpiresAt = null; // ms epoch — when the current access token expires
let driveRefreshTimer = null;   // setTimeout handle for the proactive silent refresh
let driveFolderId = null;
let driveLibraryFileId = null;
let driveSyncInFlight = false;
let driveSyncPending = false; // true when an edit happened while offline — retried once back online
let driveLastSyncedAt = null; // ms epoch of the last successful sync, for the "Synced Xm ago" line
let driveDirtyCount = 0; // # of local saves since the last successful Drive sync — surfaced
                         // as "N changes waiting to sync" so a stuck/failing sync is visible
                         // even without noticing a stale "Synced Xm ago" timestamp
try{ driveFolderId = localStorage.getItem(DRIVE_FOLDER_ID_KEY) || null; }catch(e){}
try{ driveLibraryFileId = localStorage.getItem(DRIVE_LIBRARY_FILE_ID_KEY) || null; }catch(e){}
try{ const ts = localStorage.getItem(DRIVE_LAST_SYNCED_KEY); if(ts) driveLastSyncedAt = parseInt(ts, 10) || null; }catch(e){}
try{ const dc = localStorage.getItem(DRIVE_DIRTY_COUNT_KEY); if(dc) driveDirtyCount = parseInt(dc, 10) || 0; }catch(e){}

function setDriveDirtyCount(n){
  driveDirtyCount = Math.max(0, n);
  try{ localStorage.setItem(DRIVE_DIRTY_COUNT_KEY, String(driveDirtyCount)); }catch(e){}
}

function formatRelativeTime(ms){
  const diff = Date.now() - ms;
  if(diff < 45000) return 'just now';
  const mins = Math.round(diff / 60000);
  if(mins < 60) return mins + 'm ago';
  const hours = Math.round(mins / 60);
  if(hours < 24) return hours + 'h ago';
  return Math.round(hours / 24) + 'd ago';
}
function updateSyncStatusText(){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(!driveAccessToken){ el.textContent = ''; return; }
  const pendingDeleteCount = (typeof pendingDriveDeletes !== 'undefined') ? pendingDriveDeletes.length : 0;
  if(driveDirtyCount > 0 || pendingDeleteCount > 0){
    const parts = [];
    if(driveDirtyCount > 0) parts.push(`${driveDirtyCount} ${driveDirtyCount===1?'change':'changes'}`);
    if(pendingDeleteCount > 0) parts.push(`${pendingDeleteCount} ${pendingDeleteCount===1?'deletion':'deletions'}`);
    const summary = parts.join(', ') + ' waiting to sync';
    el.textContent = driveSyncPending ? `Offline — ${summary}` : summary;
    return;
  }
  el.textContent = driveSyncPending ? 'Offline — will sync when back online'
    : driveLastSyncedAt ? ('Synced ' + formatRelativeTime(driveLastSyncedAt)) : 'Not yet synced';
}
setInterval(updateSyncStatusText, 30000); // keeps the "Xm ago" text fresh even with no new activity
window.addEventListener('online', ()=>{
  if(driveSyncPending && driveAccessToken){
    driveSyncPending = false;
    syncLibraryToDrive(true);
  }
  flushPendingDriveDeletes();
});

/* ===================== Drive deletion handling =====================
   Deleting a kriti locally used to leave its .docx sitting in Drive forever
   — deliberately deciding this one instead of leaving it undecided-by-default:
   a local delete now also removes the Drive copy. Queued + retried rather than
   attempted once, since you might be offline or between Drive sessions right
   when you delete something; a 404 (file already gone, e.g. you deleted it by
   hand in Drive, or a previous attempt actually succeeded but the response
   never got confirmed) counts as success, not failure — it only stays in the
   queue for a genuine failure (offline, auth, a real API error). */
const DRIVE_PENDING_DELETES_KEY = 'kriti-notation-studio.pendingDriveDeletes';
let pendingDriveDeletes = [];
try{ pendingDriveDeletes = JSON.parse(localStorage.getItem(DRIVE_PENDING_DELETES_KEY) || '[]'); }catch(e){ pendingDriveDeletes = []; }
function savePendingDriveDeletes(){
  try{ localStorage.setItem(DRIVE_PENDING_DELETES_KEY, JSON.stringify(pendingDriveDeletes)); }catch(e){}
}
function queueDriveDelete(filename){
  if(!filename) return;
  if(!pendingDriveDeletes.includes(filename)) pendingDriveDeletes.push(filename);
  savePendingDriveDeletes();
  updateSyncStatusText();
  flushPendingDriveDeletes();
}
/* Deletes one named file from the Drive folder. A 404 (nothing found to
   delete — already gone, or never actually made it up there) is treated as
   success, not an error, per the "confirmed gone" rule above. */
async function driveDeleteFileByName(filename){
  if(!driveFolderId) driveFolderId = await driveFindOrCreateFolder(DRIVE_FOLDER_NAME);
  const id = await driveFindFileByName(filename);
  if(!id) return; // nothing there — already gone, counts as success
  try{
    await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method: 'DELETE' });
  }catch(e){
    if(String(e.message).includes('404')) return; // race: gone between find and delete — still success
    throw e;
  }
}
let flushingDriveDeletes = false;
async function flushPendingDriveDeletes(){
  if(!driveAccessToken || !navigator.onLine) return;
  if(flushingDriveDeletes || !pendingDriveDeletes.length) return;
  flushingDriveDeletes = true;
  try{
    const remaining = [];
    for(const filename of pendingDriveDeletes){
      try{
        await driveDeleteFileByName(filename);
        // deleted, or already gone — either way, drop from the queue
      }catch(e){
        console.error('[drive delete] failed for', filename, e);
        remaining.push(filename); // genuine failure — keep for next retry
      }
    }
    pendingDriveDeletes = remaining;
    savePendingDriveDeletes();
    updateSyncStatusText();
  } finally {
    flushingDriveDeletes = false;
  }
}

function updateSyncButton(){
  const b = document.getElementById('syncBtn');
  if(!b) return;
  b.textContent = driveAccessToken ? '🔄 Sync' : '☁️ Connect to Drive';
  b.title = driveAccessToken ? 'Click to sync now' : 'Click to connect to Google Drive';
  updateSyncStatusText();
}

function clearDriveRefreshTimer(){
  if(driveRefreshTimer){ clearTimeout(driveRefreshTimer); driveRefreshTimer = null; }
}

/* Schedules a silent, invisible access-token refresh ~5 minutes before the
   current token expires (tokens last ~1hr), so in normal use you'd rarely
   ever see "Reconnect" mid-session. Uses prompt:'' (no consent UI) — this is
   the documented pattern for silently reissuing a token you already have
   an active grant for, and doesn't need a fresh user gesture. If it ever
   fails silently (e.g. the browser's Google session itself was signed out
   elsewhere), that failure is swallowed here — the token just expires
   normally and driveFetch's existing 401 handling takes over, exactly as if
   this feature didn't exist. Re-scheduled every time a new token comes in
   (initial connect or a previous silent refresh), so it's a self-renewing
   chain for as long as the app stays open. */
function scheduleDriveTokenRefresh(){
  clearDriveRefreshTimer();
  if(!driveTokenExpiresAt) return;
  const refreshAt = driveTokenExpiresAt - 5*60*1000;
  const delay = Math.max(refreshAt - Date.now(), 10000); // never less than 10s out
  driveRefreshTimer = setTimeout(()=>{
    if(!driveTokenClient) return;
    driveTokenClient.requestAccessToken({ prompt: '' });
  }, delay);
}

function initDriveTokenClient(){
  if(driveTokenClient || !window.google || !google.accounts || !google.accounts.oauth2) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      const hadTokenAlready = !!driveAccessToken;
      if(resp.error){
        console.error('[drive auth] failed:', resp);
        // Only surface an error for a real connection attempt. A failed
        // SILENT background refresh should stay invisible — the still-valid
        // token just keeps working until it naturally expires.
        if(!hadTokenAlready){
          showToast('Google Drive sign-in failed — try again');
        }
        return;
      }
      driveAccessToken = resp.access_token;
      const expiresInSec = Number(resp.expires_in) || 3600;
      driveTokenExpiresAt = Date.now() + expiresInSec*1000;
      scheduleDriveTokenRefresh();
      updateSyncButton();
      // Only run full folder setup (+ its toasts, + an immediate sync) on a
      // genuinely new connection this session — a background refresh just
      // needs the token renewed, not the whole setup flow repeated.
      if(!hadTokenAlready) setupDriveFolder();
    },
  });
}

/* This is what "opening the app newly, or after the token has timed out" both
   funnel through — connectDrive() only runs when driveAccessToken is null,
   which is true on first load AND whenever a 401 clears it out below. */
function connectDrive(){
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    showToast('Google sign-in library not loaded yet — try again in a moment');
    return;
  }
  if(!driveTokenClient) initDriveTokenClient();
  driveTokenClient.requestAccessToken({ prompt: 'consent' });
}

/* The single click handler for the Sync button — its behavior depends
   entirely on whether we're currently connected. */
function onSyncButtonClick(){
  if(!driveAccessToken){
    connectDrive();
  } else {
    syncLibraryToDrive(false);
  }
}

function sleep(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }
/* ~0.5s / 1s / 2s / 4s base, with +/-25% jitter so simultaneous retries
   (e.g. several Drive calls hitting a rate limit at once) don't all
   collide again on the exact same schedule. */
function driveBackoffDelay(attempt){
  const base = 500 * Math.pow(2, attempt);
  return Math.round(base * (0.75 + Math.random() * 0.5));
}

/* Thin fetch wrapper for Drive API calls — adds the bearer token, and retries
   TRANSIENT failures up to 4 attempts total with jittered exponential
   backoff: a network-level fetch rejection (dropped connection, brief
   offline blip), a 429 (rate limit), or a 5xx (a Google server hiccup). None
   of these are retried blindly forever — after the 4th attempt, the error
   propagates and the caller's existing failure handling (logging, "will
   retry on next edit", etc.) takes over exactly as before.
   A 401 is NEVER retried — it means the token itself is expired/invalid, so
   clearing it immediately (reverting the Sync button to "Connect") is
   correct; retrying with the same bad token would just fail 4 more times
   for no benefit. Other 4xx (bad request, not found, etc.) also aren't
   retried, since the request itself won't succeed no matter how many times
   it's repeated. */
async function driveFetch(url, opts){
  const maxAttempts = 4;
  for(let attempt=0; attempt<maxAttempts; attempt++){
    let r;
    try{
      const merged = Object.assign({}, opts||{});
      merged.headers = Object.assign({}, merged.headers||{}, { Authorization: 'Bearer ' + driveAccessToken });
      r = await fetch(url, merged);
    } catch(networkErr){
      if(attempt < maxAttempts - 1){ await sleep(driveBackoffDelay(attempt)); continue; }
      throw networkErr;
    }
    if(r.status === 401){
      driveAccessToken = null;
      updateSyncButton();
      throw new Error('drive auth expired');
    }
    if(r.status === 429 || (r.status >= 500 && r.status < 600)){
      if(attempt < maxAttempts - 1){ await sleep(driveBackoffDelay(attempt)); continue; }
      throw new Error('drive http ' + r.status);
    }
    if(!r.ok) throw new Error('drive http ' + r.status);
    return r;
  }
}

/* Finds the "Kriti Notation Studio" folder by name (searched only within files
   this app can see, per drive.file scope), creating it once if it doesn't
   exist yet. Safe to call every time you connect — never creates a duplicate,
   since it always searches first. */
async function driveFindOrCreateFolder(name){
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const j = await r.json();
  if(j.files && j.files.length) return j.files[0].id;
  const cr = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder' }),
  });
  const cj = await cr.json();
  return cj.id;
}

/* ===================== Storage usage view =====================
   A small modal showing how much Drive space THIS APP's own files are using
   — not overall account storage. Drive's about.get?fields=storageQuota
   endpoint (the previous approach) only ever reports account-WIDE usage
   across every app and every file in the account, with no way to scope it
   to one app — which is exactly the confusion this was rewritten to avoid.
   Instead, this lists every file inside the app's own Drive folder (which is
   the only place this app ever writes anything, per the drive.file scope)
   and sums their sizes directly — a true, app-only total. */
function formatBytes(n){
  if(n === undefined || n === null) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0, v = Number(n);
  while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)) + ' ' + units[i];
}

/* Sums the size of every (non-trashed) file inside the app's own Drive
   folder, paginating through files.list as needed. Returns
   {totalBytes, fileCount}. */
async function driveComputeAppStorageUsage(){
  let totalBytes = 0, fileCount = 0, pageToken = null;
  do{
    const params = new URLSearchParams({
      q: `'${driveFolderId}' in parents and trashed=false`,
      fields: 'nextPageToken,files(id,size)',
      pageSize: '1000',
      spaces: 'drive',
    });
    if(pageToken) params.set('pageToken', pageToken);
    const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?${params.toString()}`);
    const j = await r.json();
    (j.files || []).forEach(f=>{
      fileCount++;
      if(f.size !== undefined) totalBytes += Number(f.size) || 0;
    });
    pageToken = j.nextPageToken || null;
  } while(pageToken);
  return { totalBytes, fileCount };
}

async function openStorageQuota(){
  const overlay = document.getElementById('quotaOverlay');
  const body = document.getElementById('quotaBody');
  overlay.classList.add('show');
  body.innerHTML = '<div class="quota-loading">Loading…</div>';

  if(!driveAccessToken){
    body.innerHTML = '<div class="quota-error">Not connected to Google Drive yet. Close this and click Sync to connect first.</div>';
    return;
  }
  if(!driveFolderId){
    body.innerHTML = '<div class="quota-error">Drive folder isn\u2019t set up yet — try again in a moment.</div>';
    return;
  }
  try{
    const { totalBytes, fileCount } = await driveComputeAppStorageUsage();
    const filesNoun = fileCount === 1 ? 'file' : 'files';
    body.innerHTML = `
      <div class="quota-text"><b>${formatBytes(totalBytes)}</b> used by Kriti Notation Studio, across <b>${fileCount}</b> ${filesNoun}.</div>
      <div class="quota-text" style="margin-top:6px;color:var(--ink-soft,#777);font-size:12px;">This is just this app's own "${DRIVE_FOLDER_NAME}" folder in your Drive — not your overall Drive storage.</div>
    `;
  }catch(e){
    console.error('[drive storage usage] failed:', e);
    body.innerHTML = '<div class="quota-error">Couldn\u2019t load storage info — try again.</div>';
  }
}
function closeStorageQuota(){
  document.getElementById('quotaOverlay').classList.remove('show');
}

async function setupDriveFolder(){
  showToast('Connected — setting up Drive folder…');
  try{
    driveFolderId = await driveFindOrCreateFolder(DRIVE_FOLDER_NAME);
    try{ localStorage.setItem(DRIVE_FOLDER_ID_KEY, driveFolderId); }catch(e){}
    showToast('Connected to Google Drive ✓ ("Kriti Notation Studio" folder ready)');
    await syncLibraryToDrive(true);
    flushPendingDriveDeletes();
  }catch(e){
    console.error('[drive folder setup] failed:', e);
    showToast('Connected, but could not set up the Drive folder — try Sync again');
  }
}

/* Finds the existing library JSON file inside the Drive folder, if one exists
   (e.g. reconnecting later, or on a different browser) — so we PATCH the same
   file going forward instead of creating a new one every time. */
async function driveFindLibraryFile(){
  if(!driveFolderId) return null;
  const q = encodeURIComponent(`name='${DRIVE_LIBRARY_FILENAME}' and '${driveFolderId}' in parents and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
  const j = await r.json();
  return (j.files && j.files[0]) ? j.files[0].id : null;
}

/* Uploads the current library JSON — PATCHes the existing file if we know its
   id, otherwise creates it (multipart: metadata + content in one request). */
async function driveUploadLibraryJSON(){
  const body = JSON.stringify(library);
  if(driveLibraryFileId){
    const r = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveLibraryFileId}?uploadType=media&fields=id`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
    return r.json();
  }
  const boundary = 'kns' + Date.now();
  const mp = `--${boundary}\r\nContent-Type: application/json\r\n\r\n`
    + JSON.stringify({ name: DRIVE_LIBRARY_FILENAME, parents: [driveFolderId] })
    + `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const r = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
    body: mp,
  });
  return r.json();
}

/* Finds a file by exact name inside the Drive folder (any type — used for the
   .docx exports, keyed by filename so re-exporting the same song updates the
   same Drive file instead of piling up duplicates). */
async function driveFindFileByName(name){
  if(!driveFolderId) return null;
  const q = encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and '${driveFolderId}' in parents and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
  const j = await r.json();
  return (j.files && j.files[0]) ? j.files[0].id : null;
}

/* Generic binary-file upload to the Drive folder — used for .docx exports.
   Unlike the JSON sync above (which always PATCHes the one known file id),
   this looks the file up by name each time, since there can be many
   differently-named exports (one per song) rather than a single fixed file. */
/* Flags a file's latest revision as "keep forever" so Drive's automatic
   pruning of old revisions on a repeatedly-overwritten file (which is
   exactly what happens here — .docx exports are matched by filename and
   PATCHed in place on every re-export) never silently deletes an earlier
   version. Best-effort and fire-and-safe: any failure here is only logged,
   never surfaced to the user or allowed to fail the upload that already
   succeeded by the time this runs — losing "keep forever" on one revision
   isn't worth interrupting the workflow over. */
async function driveKeepRevisionForever(fileId, revisionId){
  if(!fileId || !revisionId) return;
  try{
    await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}/revisions/${revisionId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keepForever: true }),
    });
  }catch(e){
    console.error('[drive keep-forever] failed:', e);
  }
}

async function driveUploadBlob(blob, filename, mimeType){
  const existingId = await driveFindFileByName(filename);
  let result;
  if(existingId){
    const r = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media&fields=id,headRevisionId`, {
      method: 'PATCH',
      headers: { 'Content-Type': mimeType },
      body: blob,
    });
    result = await r.json();
  } else {
    const boundary = 'kns' + Date.now();
    const metadata = JSON.stringify({ name: filename, parents: [driveFolderId] });
    const body = new Blob([
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${metadata}\r\n--${boundary}\r\nContent-Type: ${mimeType}\r\n\r\n`,
      blob,
      `\r\n--${boundary}--`,
    ]);
    const r = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,headRevisionId', {
      method: 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body,
    });
    result = await r.json();
  }
  // Every upload creates a new revision (or the file's first one) — flag
  // that revision to keep forever so it's never quietly pruned once later
  // re-exports push the revision history past Drive's normal retention.
  if(result && result.id && result.headRevisionId){
    await driveKeepRevisionForever(result.id, result.headRevisionId);
  }
  return result;
}

/* Uploads a generated .docx to the Drive folder, if connected and online.
   Silent on success/failure either way — downloadDocxFile already reports
   its own "Downloaded .docx" toast for the local save; this is a best-effort
   extra, not the main action the user asked for by clicking Download. */
async function syncDocxToDrive(blob, filename){
  if(!driveAccessToken || !navigator.onLine) return;
  try{
    if(!driveFolderId) driveFolderId = await driveFindOrCreateFolder(DRIVE_FOLDER_NAME);
    await driveUploadBlob(blob, filename, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    showToast('Also saved to Google Drive ✓');
  }catch(e){
    console.error('[drive docx upload] failed:', e);
    showToast('Downloaded, but could not save a copy to Drive');
  }
}

/* The one function both the manual Sync click and the automatic
   after-every-edit sync funnel through. `auto`=true means this was triggered
   silently by an edit — no toast on success, and failures don't nag either
   (just logged; the next edit, or a manual click, will try again). `auto`=
   false (an explicit Sync-button click while already connected) always
   reports success or failure directly. */
async function syncLibraryToDrive(auto){
  if(!driveAccessToken){
    if(!auto) connectDrive();
    return;
  }
  if(!navigator.onLine){
    driveSyncPending = true;
    updateSyncStatusText();
    if(!auto) showToast('Offline — will sync once you\u2019re back online');
    return;
  }
  if(driveSyncInFlight) return;
  driveSyncInFlight = true;
  try{
    if(!driveFolderId) driveFolderId = await driveFindOrCreateFolder(DRIVE_FOLDER_NAME);
    if(!driveLibraryFileId) driveLibraryFileId = await driveFindLibraryFile();
    const res = await driveUploadLibraryJSON();
    if(res && res.id){
      driveLibraryFileId = res.id;
      try{ localStorage.setItem(DRIVE_LIBRARY_FILE_ID_KEY, driveLibraryFileId); }catch(e){}
    }
    driveSyncPending = false;
    driveLastSyncedAt = Date.now();
    try{ localStorage.setItem(DRIVE_LAST_SYNCED_KEY, String(driveLastSyncedAt)); }catch(e){}
    setDriveDirtyCount(0);
    updateSyncStatusText();
    if(!auto) showToast('Synced to Google Drive ✓');
  }catch(e){
    console.error('[drive sync] failed:', e);
    if(!auto){
      showToast(e.message === 'drive auth expired' ? 'Drive session expired — click Sync to reconnect' : 'Sync failed — will retry on next edit');
    }
  } finally {
    driveSyncInFlight = false;
  }
}

const uid = () => 'k_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function blankRow(n){
  return { swara: Array(n).fill(''), lyric: Array(n).fill('') };
}
function blankLine(cfg, kalai){
  const n = numRowsForLine(cfg, kalai);
  return { label: '', rows: Array.from({length:n}, () => blankRow(cfg.rowCells.length)) };
}
function blankSection(name, cfg, kalai, isFirst){
  return { name, sahitya: '', lines: [ blankLine(cfg, kalai) ], showPallaviRef: !isFirst, pallaviOverride: '', noSahitya: false };
}
function newSong(){
  const cfg = TALAS.adi;
  return {
    id: uid(),
    title: 'Untitled Kriti',
    raga: '', melakarta: '', arohanam: '', avarohanam: '',
    tala: 'adi', kalai: 1, composer: '',
    sections: [ blankSection('Pallavi', cfg, 1, true), blankSection('Anupallavi', cfg, 1, false), blankSection('Charanam', cfg, 1, false) ]
  };
}

/* pulls the first 2 words of the Pallavi's opening sahitya line, used for the
   "(Pallavi opening line)" reference note after Anupallavi/Charanam */
function derivedPallaviOpening(song){
  const first = song.sections[0];
  if(!first) return '';
  const line = (first.sahitya||'').split('\n').map(s=>s.trim()).find(s=>s.length>0);
  if(!line) return '';
  return line.split(/\s+/).slice(0,2).join(' ');
}

/* migrate a pre-Step-1 line (flat swara/ul/lyric arrays) into the rows[] shape,
   and a pre-Step-2 row (boolean ul[] per cell) into inline *single*-markup text */
function migrateLine(line){
  if(line && line.rows){
    line.rows.forEach(migrateRowUl);
    return line;
  }
  const r = { swara: line?.swara||[], lyric: line?.lyric||[] };
  const ul = line?.ul || [];
  r.swara = r.swara.map((s,i)=> (ul[i] && s && !/^\*/.test(s)) ? `*${s}*` : s);
  return { label: (line && line.label) || '', rows: [ r ] };
}
function migrateRowUl(r){
  if(!r.ul) return;
  r.swara = r.swara.map((s,i)=> (r.ul[i] && s && !/^\*/.test(s)) ? `*${s}*` : s);
  delete r.ul;
}

/* ===================== Storage =====================
   Uses localStorage — real, always-available browser storage — since this app
   now runs as a standalone hosted page (GitHub Pages), not inside Claude's
   Artifact viewer. (window.storage, used earlier, only exists in that
   sandbox and silently does nothing on a real site — this was actually
   broken before, independent of anything to do with Drive.) Drive sync
   (added in the next step) layers on top of this as backup/cross-device
   sync; localStorage remains the fast, offline-first local copy. */
const LOCAL_STORAGE_KEY = 'kriti-notation-studio.library';
async function loadLibrary(){
  try{
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    library = raw ? JSON.parse(raw) : [];
  }catch(e){ library = []; }
  library.forEach(s=>{
    if(s.kalai === undefined) s.kalai = 1;
    if(s.melakarta === undefined) s.melakarta = '';
    (s.sections||[]).forEach((sec, si)=>{
      sec.lines = (sec.lines||[]).map(migrateLine);
      if(sec.showPallaviRef === undefined) sec.showPallaviRef = si !== 0;
      if(sec.pallaviOverride === undefined) sec.pallaviOverride = '';
      if(sec.noSahitya === undefined) sec.noSahitya = false;
    });
  });
}
/* combines raga + melakarta into the display/export string, e.g. "Mohanam (28th Melakarta Janya)" */
function ragaDisplay(song){
  const m = (song.melakarta||'').trim();
  if(!m) return song.raga || '';
  return `${song.raga || ''} (${m} Melakarta Janya)`;
}
let saveInFlight = false;
let saveQueued = false;
async function persist(){
  try{
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(library));
  }catch(e){
    // Background autosave failures are silent now — typing shouldn't be
    // interrupted by a toast. It'll be retried on the next edit, and the
    // explicit "Save now" button still reports success/failure directly.
    console.error('[persist] localStorage save failed:', e);
  }
  // One more local change Drive doesn't have yet — shown as "N changes
  // waiting to sync" until the next successful sync resets it to 0. Tracked
  // regardless of connection state, so it's accurate the moment you do connect.
  setDriveDirtyCount(driveDirtyCount + 1);
  updateSyncStatusText();
  // Auto-sync to Drive on every save, but only if already connected and the
  // browser reports it's online — silent either way (auto=true), since this
  // fires on every single edit. If we're not connected, this is a no-op (the
  // Sync button is how you connect in the first place).
  if(driveAccessToken && navigator.onLine) syncLibraryToDrive(true);
}
/* Debounced: waits until typing pauses (800ms of silence) before actually
   writing to storage, instead of firing on every keystroke. This is the main
   fix for the rate-limit errors during fast typing — far fewer save calls
   go out overall. Still guards against overlapping in-flight calls. */
let saveDebounceTimer = null;
function queueSave(){
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{
    if(saveInFlight){ saveQueued = true; return; }
    saveInFlight = true;
    persist().finally(()=>{
      saveInFlight = false;
      if(saveQueued){ saveQueued = false; queueSave(); }
    });
  }, 800);
}

/* ===================== Rendering ===================== */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._hideT);
  t._hideT = setTimeout(()=>t.classList.remove('show'), 1400);
}

function renderSongList(){
  const list = document.getElementById('songList');
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  list.innerHTML = '';
  const filtered = library.filter(s => (s.title+' '+s.raga).toLowerCase().includes(q));
  if(!library.length){
    list.innerHTML = '<div class="empty-note">No kritis yet. Click <b>+ New Kriti</b> to start your library — everything you add stays saved here.</div>';
    return;
  }
  if(!filtered.length){
    list.innerHTML = '<div class="empty-note">No matches.</div>';
    return;
  }
  filtered.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'song-item' + (s.id===currentId ? ' active' : '');
    el.innerHTML = `<div class="t">${escapeHtml(s.title||'Untitled')}</div><div class="m">${escapeHtml(s.raga||'—')} · ${TALAS[s.tala]?.label||s.tala}</div>`;
    el.onclick = ()=>{ currentId = s.id; renderAll(); };
    list.appendChild(el);
  });
}

/* Forces case (upper for swara, lower for sahitya) while typing, preserving
   cursor position. Markup chars (* , ; ' .) are untouched automatically since
   toUpperCase/toLowerCase only affect cased letters. */
function forceCaseLive(inp, mode){
  const start = inp.selectionStart, end = inp.selectionEnd;
  const converted = mode === 'upper' ? inp.value.toUpperCase() : inp.value.toLowerCase();
  if(converted !== inp.value){
    inp.value = converted;
    inp.setSelectionRange(start, end);
  }
  return inp.value;
}

/* Shared filter-while-typing helper: applies a case transform, then strips any
   character not in `allowed`, adjusting the cursor position by however many
   characters were removed ahead of it (so typing stays smooth instead of the
   caret jumping to the end). Used for both swara and per-cell sahitya inputs. */
function filterCaseLive(inp, mode, allowed){
  const start = inp.selectionStart, end = inp.selectionEnd;
  const cased = mode === 'upper' ? inp.value.toUpperCase() : inp.value.toLowerCase();
  let filtered = '', removedBeforeStart = 0, removedBeforeEnd = 0;
  for(let i = 0; i < cased.length; i++){
    const ch = cased[i];
    if(allowed.test(ch)){
      filtered += ch;
    } else {
      if(i < start) removedBeforeStart++;
      if(i < end) removedBeforeEnd++;
    }
  }
  if(filtered !== inp.value){
    inp.value = filtered;
    inp.setSelectionRange(Math.max(0, start - removedBeforeStart), Math.max(0, end - removedBeforeEnd));
  }
  return inp.value;
}
/* Swara cells: only the 7 swara letters S R G M P D N (lowercase auto-capitalized,
   same as before), plus "*" (speed markup), ";", "," (symbols), "'" and "."
   (octave marks), and space (used e.g. to visually group an underlined run into
   syllable-pairs, per the notation convention). Everything else is blocked. */
const SWARA_ALLOWED = /[SRGMPDN*;,'. ]/;
function sanitizeSwaraLive(inp){ return filterCaseLive(inp, 'upper', SWARA_ALLOWED); }
/* Per-cell sahitya (aligned lyric) inputs: letters unrestricted (any, lowercased
   as before), plus only "-" and "." as symbols, and space (needed for splitting
   into aligned syllables). Everything else — digits, other punctuation — blocked.
   Note: this does NOT apply to the free-text "Sahitya (plain lyrics)" textarea,
   which still allows normal prose punctuation. */
const LYRIC_CELL_ALLOWED = /[a-z\-. |]/;
function sanitizeLyricCellLive(inp){ return filterCaseLive(inp, 'lower', LYRIC_CELL_ALLOWED); }

/* Custom keyboard navigation for a physical row's cells:
   - Tab: all swara cells left-to-right, then all lyric cells left-to-right.
     At the very end of lyrics, Tab falls through to native flow (leaves the row).
   - Shift+Tab: reverse of the above; at the very start of swara, falls through natively.
   Ctrl+Arrow navigation is handled separately by wireGlobalCtrlNavigation(), since it
   now spans every line in every section rather than staying within one physical row. */
function wireCellNavigation(swaraInputs, lyricInputs){
  const all = { swara: Array.from(swaraInputs), lyric: Array.from(lyricInputs) };
  function focusAt(type, idx){
    const arr = all[type];
    if(idx >= 0 && idx < arr.length){ arr[idx].focus(); return true; }
    return false;
  }
  function handler(type, idx){
    return (e)=>{
      if(e.key !== 'Tab' || e.ctrlKey) return;
      if(!e.shiftKey){
        if(type === 'swara'){
          if(idx < all.swara.length - 1){ e.preventDefault(); focusAt('swara', idx+1); }
          else { e.preventDefault(); focusAt('lyric', 0); }
        } else {
          if(idx < all.lyric.length - 1){ e.preventDefault(); focusAt('lyric', idx+1); }
          /* else: let native Tab leave the row */
        }
      } else {
        if(type === 'lyric'){
          if(idx > 0){ e.preventDefault(); focusAt('lyric', idx-1); }
          else { e.preventDefault(); focusAt('swara', all.swara.length-1); }
        } else {
          if(idx > 0){ e.preventDefault(); focusAt('swara', idx-1); }
          /* else: let native Shift+Tab leave the row backward */
        }
      }
    };
  }
  all.swara.forEach((inp,i)=> inp.addEventListener('keydown', handler('swara', i)));
  all.lyric.forEach((inp,i)=> inp.addEventListener('keydown', handler('lyric', i)));
}

/* Song-wide Ctrl+Arrow navigation, wired once (in DOM order) across every physical
   row, every line, and every section of the current song:
   - Ctrl+Right/Left: one continuous sequence through EVERY cell — for each
     physical row (in song order), all its swara cells left-to-right, then all
     its lyric cells left-to-right (the same per-row order Tab already uses),
     then straight on into the next physical row/line/section with no stop at
     any boundary. So from the last lyric cell of one line, Ctrl+Right lands on
     the first swara cell of the next line (or next section's first line).
   - Ctrl+Down: from a swara cell -> the lyric cell in that same beat-cell (same
     row). From a lyric cell -> the swara cell at the SAME position in the NEXT
     physical row (crossing into the next line, or the next kalai-half).
   - Ctrl+Up: from a lyric cell -> the swara cell in that same beat-cell (same
     row). From a swara cell -> the lyric cell at the SAME position in the
     PREVIOUS physical row (crossing into the previous line/kalai-half).
   Up/Down give a continuous vertical cycle alternating swara/lyric down (or
   up) the whole song; Right/Left now give the equivalent continuous
   left-to-right reading order across everything. Same-row matches use DOM
   sibling lookup ('.beat-cell'); cross-line matches use each cell's position
   within its own physical row, since every physical row in a song has the
   same cell count (one tala per song). */
function wireGlobalCtrlNavigation(host){
  const swaraInputs = Array.from(host.querySelectorAll('input.swara'));
  const lyricInputs = Array.from(host.querySelectorAll('input.lyric'));
  const physRows = Array.from(host.querySelectorAll('.phys-row'));

  // One unified left-to-right sequence for Ctrl+Right/Left: walk the physical
  // rows in song order, and within each row put all swara cells before all
  // lyric cells — exactly Tab's own per-row order, just never stopping.
  const sequence = [];
  physRows.forEach(row=>{
    Array.from(row.querySelectorAll('input.swara')).forEach(inp=> sequence.push(inp));
    Array.from(row.querySelectorAll('input.lyric')).forEach(inp=> sequence.push(inp));
  });
  const seqIndex = new Map(sequence.map((inp,i)=>[inp,i]));

  function focusAt(arr, idx){
    if(idx >= 0 && idx < arr.length) arr[idx].focus();
  }
  function wire(inp, type){
    inp.addEventListener('keydown', (e)=>{
      if(!e.ctrlKey) return;
      if(e.key === 'ArrowRight'){ e.preventDefault(); focusAt(sequence, seqIndex.get(inp)+1); return; }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); focusAt(sequence, seqIndex.get(inp)-1); return; }

      const physRow = inp.closest('.phys-row');
      if(!physRow) return;
      const physIdx = physRows.indexOf(physRow);

      if(e.key === 'ArrowDown'){
        if(type === 'swara'){
          const lyricInp = inp.closest('.beat-cell')?.querySelector('input.lyric');
          if(lyricInp){ e.preventDefault(); lyricInp.focus(); }
        } else {
          const posInRow = Array.from(physRow.querySelectorAll('input.lyric')).indexOf(inp);
          const nextRow = physRows[physIdx+1];
          const target = nextRow ? nextRow.querySelectorAll('input.swara')[posInRow] : null;
          if(target){ e.preventDefault(); target.focus(); }
        }
      } else if(e.key === 'ArrowUp'){
        if(type === 'lyric'){
          const swaraInp = inp.closest('.beat-cell')?.querySelector('input.swara');
          if(swaraInp){ e.preventDefault(); swaraInp.focus(); }
        } else {
          const posInRow = Array.from(physRow.querySelectorAll('input.swara')).indexOf(inp);
          const prevRow = physRows[physIdx-1];
          const target = prevRow ? prevRow.querySelectorAll('input.lyric')[posInRow] : null;
          if(target){ e.preventDefault(); target.focus(); }
        }
      }
    });
  }
  swaraInputs.forEach(inp=> wire(inp, 'swara'));
  lyricInputs.forEach(inp=> wire(inp, 'lyric'));
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* convert typed shortcuts: S' -> upper octave dot, S. -> lower octave dot */
function octaveDisplay(text){
  if(!text) return '';
  return text
    .replace(/([A-Za-z])'/g, (m,c)=> c + '\u0307')
    .replace(/([A-Za-z])\./g, (m,c)=> c + '\u0323');
}

/* ---------- Akshara counting ----------
   Outside any underline (1st speed): letter=2, ","=1, ";"=2.
   Inside *single* (2nd speed): every symbol (letter, comma, semicolon) = 1.
   Inside **double** (3rd speed): every symbol (letter, comma, semicolon) = 0.5.
   This keeps every underlined cell at a hard ceiling of its capacity (4 or 6). */
function computeCellAkshara(raw){
  if(!raw) return { total: 0 };
  const markupRe = /\*\*(.+?)\*\*|\*(.+?)\*/g;
  const tokenRe = /[A-Za-z][\'\.]?|,|;/g;
  let total = 0, last = 0, m;

  function tallyPlain(text){
    let tm; tokenRe.lastIndex = 0;
    while((tm = tokenRe.exec(text)) !== null){
      const tok = tm[0];
      if(tok === ',') total += 1;
      else if(tok === ';') total += 2;
      else total += 2;
    }
  }
  function tallyUnderlined(text, flatVal){
    let tm; tokenRe.lastIndex = 0;
    while((tm = tokenRe.exec(text)) !== null){ total += flatVal; }
  }

  while((m = markupRe.exec(raw)) !== null){
    if(m.index > last) tallyPlain(raw.slice(last, m.index));
    if(m[1] !== undefined) tallyUnderlined(m[1], 0.5);
    else tallyUnderlined(m[2], 1);
    last = markupRe.lastIndex;
  }
  if(last < raw.length) tallyPlain(raw.slice(last));
  return { total };
}
function formatAksh(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function updateAksharaBadge(cellDiv, raw, capacity){
  const badge = cellDiv.querySelector('.aksh-badge');
  if(!badge) return;
  if(!raw){ badge.textContent = ''; badge.className = 'aksh-badge'; return; }
  const { total } = computeCellAkshara(raw);
  const ok = Math.abs(total - capacity) < 1e-9;
  badge.textContent = ok ? `${formatAksh(total)} \u2713` : `${formatAksh(total)}/${capacity} \u26A0`;
  badge.className = 'aksh-badge ' + (ok ? 'ok' : 'bad');
}
/* parse inline underline markup: **text** -> double underline (3rd speed),
   *text* -> single underline (2nd speed). Returns escaped+styled HTML. */
function parseSwaraMarkup(raw){
  if(!raw) return ' ';
  const re = /\*\*(.+?)\*\*|\*(.+?)\*/g;
  let out = '', last = 0, m;
  while((m = re.exec(raw)) !== null){
    if(m.index > last) out += escapeHtml(octaveDisplay(raw.slice(last, m.index)));
    if(m[1] !== undefined) out += `<span class="ul-dbl">${escapeHtml(octaveDisplay(m[1]))}</span>`;
    else out += `<span class="ul-sgl">${escapeHtml(octaveDisplay(m[2]))}</span>`;
    last = re.lastIndex;
  }
  if(last < raw.length) out += escapeHtml(octaveDisplay(raw.slice(last)));
  return out || ' ';
}

/* ---------- Syllable-to-swara alignment (Option B) ----------
   Tokenizes a cell's swara text into an ordered list of alignment "items",
   each carrying a .display string and .underline level. Outside any
   underline, this is unchanged: every letter/,/; is its own item (1 note =
   1 syllable), exactly as before.

   Inside a *...* or **...** span, a space (which the swara display itself
   has always silently ignored — 0 printed spacing inside underline, per the
   spacing rules) now doubles as an explicit "syllable group" boundary marker
   for the SAHITYA aligner only:
     - No space anywhere in that underline span -> legacy behavior, every
       note in it is still its own item (1 note = 1 syllable), unchanged.
     - At least one space somewhere in that span -> grouping mode for that
       span only: notes with no space between them merge into one item
       (one syllable spans however many notes are in the group); a space
       marks where one group ends and the next begins.
   A fully-spaced-out run (space before every note) lands on the same
   1-note-1-group result as the no-space case, so there's no conflict
   between the two rules. The printed swara text is completely unaffected
   either way — grouping only changes how sahitya syllables line up. */
/* Tokenizes a cell's swara text into an ordered list of alignment "items",
   each carrying .display and .underline. Outside underline, unchanged: every
   letter/,/; is its own item (1 note = 1 syllable). Inside an underlined
   span (single or double):
     - No space anywhere in that span -> legacy: every note its own item.
     - At least one space -> grouping mode: notes with no space between them
       merge into one item; a space marks where one group ends and the next
       begins.
   Each group item now also carries .gapBefore — the exact number of literal
   space characters that were typed right before it (only meaningful between
   two groups of the SAME underline span). This lets buildAlignedColumns tell
   "1 space, just marking the group boundary" (0 visible gap, as always)
   apart from "2+ spaces, an explicit visual gap request" (visible gap of
   count-1), per the confirmed rule: 1 space is purely structural, anything
   beyond that is a deliberate formatting choice that should show up in the
   Word file. */
function tokenizeSwaraForAlign(raw){
  if(!raw) return [];
  const markupRe = /\*\*(.+?)\*\*|\*(.+?)\*/g;
  const tokenRe = /[A-Za-z][\'\.]?|,|;/g;
  const items = [];

  function makeItem(toks, underline, gapBefore){
    return { display: toks.map(t=>t.display).join(''), underline, gapBefore: gapBefore || 0 };
  }
  // Shared grouping logic for BOTH plain (underline=0) and underlined
  // (underline=1/2) spans: tokens with zero typed spaces between them merge
  // into one group/item (one syllable's worth); any 1+ typed spaces start a
  // new group, and the exact typed count is kept (gapBefore) so the spacing
  // rules below can tell "just the grouping marker" apart from "a deliberate
  // wider gap request" — the same mechanism that already applied inside
  // underlined (2nd/3rd speed) spans now applies uniformly to plain (1st
  // speed) text too, not just inside underlines as before.
  //
  // `alwaysGroup` (true for plain spans) skips the "no break anywhere in
  // this span -> legacy, every token separate" fallback that underline
  // spans still use below. That fallback exists for underline specifically
  // to keep pre-existing, already-notated songs (typed compactly, before
  // grouping existed) rendering exactly as before. Plain text never had
  // that history — typed spaces there were previously ignored entirely, so
  // there's no old behavior to preserve — and the agreed intent is that a
  // fully compact plain cell like "SRG" (zero spaces throughout) merges
  // into one group now, same as it would if even one space were typed
  // elsewhere in that cell. Underlined spans are untouched by this change.
  function pushSpan(text, underline, alwaysGroup){
    tokenRe.lastIndex = 0;
    const matches = [...text.matchAll(tokenRe)];
    if(!matches.length) return;
    const raw2 = matches.map((tm, idx) => {
      let gapLen = 0;
      if(idx > 0){
        const prevEnd = matches[idx-1].index + matches[idx-1][0].length;
        gapLen = (text.slice(prevEnd, tm.index).match(/ /g) || []).length;
      }
      return { display: octaveDisplay(tm[0]), gapLen };
    });
    const hasAnyBreak = raw2.some(t => t.gapLen > 0);
    if(hasAnyBreak || alwaysGroup){
      let cur = [];
      let curGapBefore = 0; // gap that led INTO the group currently being built
      raw2.forEach(t=>{
        if(t.gapLen > 0 && cur.length){
          items.push(makeItem(cur, underline, curGapBefore));
          cur = [];
          curGapBefore = t.gapLen;
        }
        cur.push(t);
      });
      if(cur.length) items.push(makeItem(cur, underline, curGapBefore));
    } else {
      raw2.forEach(t => items.push(makeItem([t], underline, 0)));
    }
  }
  let last = 0, m;
  while((m = markupRe.exec(raw)) !== null){
    if(m.index > last) pushSpan(raw.slice(last, m.index), 0, true);
    if(m[1] !== undefined) pushSpan(m[1], 2, false);
    else pushSpan(m[2], 1, false);
    last = markupRe.lastIndex;
  }
  if(last < raw.length) pushSpan(raw.slice(last), 0, true);
  return items;
}

/* Column-aligns swara tokens against space-separated sahitya syllables.
   For every boundary between token i and token i+1, ONE shared "gap" (a
   literal space count) is computed and applied identically to both the
   swara and sahitya lines, so they're always built on the same ruler:
     - no next token (last in the cell)              -> 0
     - both tokens inside a speed-group               -> 0, UNLESS the user
       typed 2+ literal spaces at that exact group boundary, in which case
       the gap is (typed count - 1) — 1 space is just the grouping marker,
       anything beyond that is a deliberate visible-gap request
     - crossing into/out of a speed-group             -> 1 (fixed, overrides
       everything else, same as before)
     - both plain, left is a swara letter              -> 2
     - both plain, left is ',' or ';'                  -> 1
   Neither line is ever truncated: a syllable longer than its token (or vice
   versa) simply occupies more character positions — nothing pads or clips
   it to a fixed column width. Gap size depends only on the swara tokens,
   never on syllable length.

   Sahitya wrapped in |...| (e.g. "|Krishna|") is a deliberate single,
   unbreakable syllable for the whole cell — the pipes are stripped from the
   rendered text (never printed), the content is treated as ONE syllable
   even if it contains internal spaces, and the normal token-count-vs-
   syllable-count mismatch check is skipped entirely for that cell, since
   the pipes are the user's explicit signal that this is intentional. */
function buildAlignedColumns(rawSwara, rawLyric){
  const tokens = tokenizeSwaraForAlign(rawSwara);
  const trimmedLyric = (rawLyric||'').trim();
  // "|word|" marks ONE syllable as an intentional unbreakable word (e.g. a
  // name that can't be split into one-per-note pieces) — the pipes are a
  // typed marker only, stripped before rendering, never shown in the output.
  // Checked PER WORD (not just whether the whole cell is wrapped), so this
  // works both when the entire cell is one such word ("|vandenishamaham|")
  // and when it's one word among several normal syllables in the same cell
  // ("abc |defghij| klm") — previously only the whole-cell case was handled,
  // so a mid-cell wrapped word kept its literal "|" characters in the output.
  const rawWords = trimmedLyric ? trimmedLyric.split(/\s+/) : [];
  let forcedNoMismatch = false;
  const syllables = rawWords.map(w=>{
    if(w.length >= 2 && w.startsWith('|') && w.endsWith('|')){
      forcedNoMismatch = true;
      return w.slice(1, -1).replace(/\|/g, '');
    }
    return w;
  });
  const n = Math.max(tokens.length, syllables.length);
  const swaraCols = [], lyricCols = [];
  for(let i=0;i<n;i++){
    const tok = tokens[i];
    const nextTok = tokens[i+1];
    const tokDisplay = tok ? tok.display : '';
    const syl = syllables[i] || '';
    const underline = tok ? tok.underline : 0;

    let gap;
    if(!tok || !nextTok){
      gap = 0;
    } else if(underline && nextTok.underline){
      const typed = nextTok.gapBefore || 0;
      gap = typed >= 2 ? typed - 1 : 0;
    } else if(!!underline !== !!nextTok.underline){
      gap = 1;
    } else {
      // Both plain (1st speed) — same "typed spaces beyond the baseline add
      // extra visible spaces on top" idea as underlined groups above, but
      // using plain's own baseline (2 between swara-letter groups, 1 around
      // a plain ','/';') instead of underline's baseline of 1. Since
      // grouping now applies to plain text too, nextTok.gapBefore is always
      // >=1 here — a plain boundary only exists because at least 1 space
      // was typed there (zero typed spaces means the tokens merged into one
      // group instead, per the tokenizer above, and never reach this branch).
      const isPunct = tokDisplay === ',' || tokDisplay === ';';
      const baseline = isPunct ? 1 : 2;
      const typed = nextTok.gapBefore || 0;
      gap = Math.max(baseline, typed);
    }

    // Pad whichever of {swara-group text, sahitya syllable} is shorter up to
    // match the longer one's length, with purely invisible trailing space,
    // BEFORE the deliberate `gap` spacing is added. This guarantees the next
    // item starts at the same character column on both lines, regardless of
    // which side is longer — fixes "de" landing under "N" instead of "PN"
    // when the syllable (van/de) is longer than its swara group (PG/PN).
    // Never adds a visible gap you didn't type; only ever fills in the
    // length difference that already exists between the two.
    const core = Math.max(tokDisplay.length, syl.length, 1);
    const swaraCore = tok ? tokDisplay.padEnd(core) : tokDisplay;
    const lyricCore = syl.padEnd(core);

    swaraCols.push({ text: swaraCore + ' '.repeat(gap), underline });
    lyricCols.push(lyricCore + ' '.repeat(gap));
  }
  const mismatch = forcedNoMismatch ? false : (tokens.length !== syllables.length);
  return { swaraCols, lyricCols, tokenCount: tokens.length, syllableCount: syllables.length, mismatch };
}

function updateAlignBadge(cellDiv, rawSwara, rawLyric){
  const badge = cellDiv.querySelector('.align-badge');
  if(!badge) return;
  if(!rawSwara && !rawLyric){ badge.textContent = ''; badge.className = 'align-badge'; return; }
  const { tokenCount, syllableCount, mismatch } = buildAlignedColumns(rawSwara, rawLyric);
  if(!rawLyric){ badge.textContent = ''; badge.className = 'align-badge'; return; }
  badge.textContent = mismatch ? `${syllableCount}/${tokenCount} syl \u26A0` : '';
  badge.className = 'align-badge' + (mismatch ? ' bad' : '');
}

function getSong(){ return library.find(s=>s.id===currentId); }

function renderMain(){
  const main = document.getElementById('main');
  const song = getSong();
  if(!song){
    main.innerHTML = `
      <div class="hero"><div><h1>Kriti Notation Studio</h1><p>Pick a kriti on the left, or start a new one.</p></div></div>
      <div class="placeholder">
        <div class="glyph">॥</div>
        <h2>Your library is ready</h2>
        <div>Click <b>+ New Kriti</b> to notate your first song in your own grid format.</div>
      </div>`;
    return;
  }

  main.innerHTML = `
    <div class="hero">
      <div>
        <h1 contenteditable="true" id="titleEdit" style="outline:none;" spellcheck="false" autocorrect="off" autocapitalize="off">${escapeHtml(song.title)}</h1>
        <p>Edits save automatically to your library.</p>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" id="previewBtn">👁 Preview</button>
      <button class="btn primary" id="downloadDocxBtn">⬇ Download Word (.docx)</button>
      <button class="btn" id="saveBtn">💾 Save now</button>
      <button class="btn" id="copyDataBtn">📋 Copy data for Claude (→ .docx)</button>
      <button class="btn danger" id="deleteBtn">🗑️ Delete kriti</button>
    </div>

    <div class="card">
      <h3>Song details</h3>
      <div class="field-grid">
        <div class="fieldwrap"><label>Raga</label><input type="text" id="f_raga" value="${escapeHtml(song.raga)}" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></div>
        <div class="fieldwrap"><label>Melakarta # (optional)</label><input type="text" id="f_mela" value="${escapeHtml(song.melakarta)}" placeholder="e.g. 28th" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></div>
        <div class="fieldwrap"><label>Composer</label><input type="text" id="f_composer" value="${escapeHtml(song.composer)}" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></div>
        <div class="fieldwrap"><label>Arohanam</label><input type="text" id="f_aro" value="${escapeHtml(song.arohanam)}" placeholder="S R2 G3 M1 P D2 N3 S" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></div>
        <div class="fieldwrap"><label>Avarohanam</label><input type="text" id="f_ava" value="${escapeHtml(song.avarohanam)}" placeholder="S N3 D2 P M1 G3 R2 S" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></div>
        <div class="fieldwrap">
          <label>Talam</label>
          <select id="f_tala">
            ${Object.entries(TALAS).map(([k,v])=>`<option value="${k}" ${song.tala===k?'selected':''}>${v.label} (${v.aksharasPerAvartanam}/avartanam)</option>`).join('')}
          </select>
        </div>
        <div class="fieldwrap" id="kalaiWrap" style="${TALAS[song.tala].kalaiAware?'':'display:none;'}">
          <label>Kalai (Adi only)</label>
          <select id="f_kalai">
            <option value="1" ${song.kalai===1?'selected':''}>1 kalai (32/row)</option>
            <option value="2" ${song.kalai===2?'selected':''}>2 kalai (64 total, shown as 2 rows of 32)</option>
          </select>
        </div>
      </div>
    </div>

    <div id="sectionsHost"></div>

    <button class="btn add-line-btn" id="addSectionBtn">+ Add section (e.g. Chittaswaram)</button>
    <div class="hint" style="margin-top:18px;">
      Octave shortcuts — <code>S'</code> → upper-octave dot (tāra sthāyi) &nbsp; <code>S.</code> → lower-octave dot (mandra sthāyi).<br>
      Speed underline — wrap part (or all) of a cell in <code>*text*</code> for single underline (2nd speed) or <code>**text**</code> for double underline (3rd speed), e.g. <code>SR*GSR*</code>.<br>
      Each cell checks its own akshara count live as you type — a small green ✓ under the cell means it matches that cell's capacity; a red count/⚠ means it doesn't.
    </div>
  `;

  document.getElementById('titleEdit').oninput = e=>{ song.title = e.target.textContent; renderSongList(); queueSave(); };
  document.getElementById('f_raga').oninput = e=>{ song.raga=e.target.value; renderSongList(); queueSave(); };
  document.getElementById('f_mela').oninput = e=>{ song.melakarta=e.target.value; renderSongList(); queueSave(); };
  document.getElementById('f_composer').oninput = e=>{ song.composer=e.target.value; queueSave(); };
  document.getElementById('f_aro').oninput = e=>{ song.arohanam=e.target.value; queueSave(); };
  document.getElementById('f_ava').oninput = e=>{ song.avarohanam=e.target.value; queueSave(); };
  document.getElementById('f_tala').onchange = e=>{
    song.tala = e.target.value;
    document.getElementById('kalaiWrap').style.display = TALAS[song.tala].kalaiAware ? '' : 'none';
    queueSave(); renderMain();
  };
  const kalaiEl = document.getElementById('f_kalai');
  if(kalaiEl) kalaiEl.onchange = e=>{ song.kalai = Number(e.target.value); queueSave(); renderMain(); };

  document.getElementById('saveBtn').onclick = async ()=>{ await persist(); showToast('Saved'); };
  document.getElementById('previewBtn').onclick = openPreview;
  document.getElementById('downloadDocxBtn').onclick = ()=>downloadDocxFile(song);
  document.getElementById('copyDataBtn').onclick = ()=>copyForClaude(song);
  document.getElementById('deleteBtn').onclick = ()=>deleteSong(song.id);
  document.getElementById('addSectionBtn').onclick = ()=>{
    song.sections.push(blankSection('New Section', TALAS[song.tala], song.kalai, false));
    queueSave(); renderSections();
