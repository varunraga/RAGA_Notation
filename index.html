<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CA Study — The Reading Room</title>
<meta name="theme-color" content="#0D0F13">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0D0F13; --bg-elev:#171A20; --bg-elev-2:#1E222A; --border:rgba(255,255,255,.09); --text:#F2F1ED; --text-dim:#9498A6;
  --accent:#D9B24C; --accent-2:#F0CD73; --accent-soft:rgba(217,178,76,.14); --danger:#E5534B; --danger-soft:rgba(229,83,75,.16); --danger-ink:#FF9A90; --ink-on-accent:#241B05; --radius:14px;
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --mark-yellow:#FFD84D80; --mark-green:#5FE0A080; --mark-blue:#7EB6FF80; --mark-red:#FF8A7580; --mark-purple:#CB9CFF80; --mark-orange:#FFAB5C80;
  --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
  --glow: 0 0 0 1px rgba(217,178,76,.2), 0 4px 18px rgba(217,178,76,.12);
}
html.light{
  --bg:#FAF7F0; --bg-elev:#FFFFFF; --bg-elev-2:#F5F1E6; --border:rgba(20,18,10,.09); --text:#1C1A16; --text-dim:#6B6558;
  --accent:#B8860B; --accent-2:#8F6A08; --accent-soft:#F3E7C8; --danger:#B3382C; --danger-soft:#F6DEDA; --danger-ink:#7A2A20; --ink-on-accent:#241B05;
  --mark-yellow:#FFD84Dcc; --mark-green:#7FE0A0cc; --mark-blue:#8FC7FAcc; --mark-red:#FF9585cc; --mark-purple:#D9AEFFcc; --mark-orange:#FFB870cc;
  --shadow-card: 0 1px 2px rgba(20,18,10,.05), 0 10px 26px rgba(20,18,10,.07);
  --glow: 0 0 0 1px rgba(184,134,11,.18), 0 4px 16px rgba(184,134,11,.10);
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:#D9B24C40;}
.app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR — a refined private-study rail */
.sidebar{width:256px;flex-shrink:0;background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;position:relative;}
.sidebar-header{padding:22px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.sidebar-seal{width:38px;height:38px;border-radius:11px;flex-shrink:0;object-fit:contain;box-shadow:var(--glow);}
.sidebar-wordmark{font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.2;}
.sidebar-wordmark small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;color:var(--text-dim);letter-spacing:.03em;}
.sidebar-section{padding:8px 12px 4px;}
.sidebar-label{font-size:11px;color:var(--text-dim);padding:12px 8px 6px;font-family:var(--sans);font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s ease,color .12s ease;}
.nav-item:hover{background:var(--bg-elev-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:var(--glow);}
.nav-item .badge{margin-left:auto;background:var(--accent);color:var(--ink-on-accent);font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;}
.nav-item-featured{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--accent);font-weight:700;margin-bottom:6px;border:1px solid rgba(217,178,76,.25);}
.nav-item-featured:hover{background:linear-gradient(90deg,var(--accent-soft),rgba(217,178,76,.06));color:var(--accent);}
.nav-item-featured.active{box-shadow:var(--glow);}
.tree{padding-left:2px;}
.del-mini{opacity:.4;font-size:12px;color:var(--text-dim);padding:2px 5px;border-radius:5px;transition:opacity .12s ease;}
.del-mini:hover{opacity:1;color:var(--danger);background:var(--danger-soft);}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg-elev);}
.topbar input.search-top{flex:1;max-width:420px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:8px 15px;font-size:13.5px;color:var(--text-dim);font-family:var(--sans);}
.topbar .spacer{flex:1;}
.icon-btn{background:none;border:1px solid transparent;border-radius:9px;padding:7px 10px;color:var(--text-dim);font-size:14px;transition:background .12s ease;}
.icon-btn:hover{background:var(--bg-elev-2);color:var(--text);}
.content{flex:1;min-width:0;max-width:100%;overflow-y:auto;overflow-x:hidden;padding:28px 32px 80px;background:radial-gradient(ellipse 1100px 480px at 50% -12%,rgba(217,178,76,.07),transparent 65%);}
.content.narrow{max-width:780px;margin:0 auto;}

/* BUTTONS — gold gradient primary, refined premium feel */
.btn{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--ink-on-accent);border:none;border-radius:10px;padding:9px 17px;font-size:13.5px;font-weight:700;letter-spacing:.01em;transition:transform .1s ease,box-shadow .15s ease;box-shadow:0 2px 10px rgba(217,178,76,.18);}
.btn:hover{box-shadow:0 4px 18px rgba(217,178,76,.3);transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.98);}
.btn.secondary{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);box-shadow:none;}
.btn.secondary:hover{background:var(--bg-elev-2);box-shadow:none;border-color:var(--accent);}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 2px 10px rgba(229,83,75,.2);}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:8px;}

/* CARDS */
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-card);}
.grid{display:grid;gap:14px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}
.progress-bar{height:7px;background:var(--bg-elev-2);border-radius:6px;overflow:hidden;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg-elev-2);color:var(--text-dim);border:1px solid var(--border);}
.pill.warn{background:var(--danger-soft);color:var(--danger-ink);border-color:transparent;}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:14px;border:1px solid var(--border);color:var(--text-dim);margin:0 4px 4px 0;cursor:pointer;}
.tag:hover{border-color:var(--accent);color:var(--accent);}
.list-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;cursor:pointer;}
.list-row:hover{background:var(--bg-elev-2);}

/* SUBJECTS HUB */
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.subject-card{position:relative;background:var(--bg-elev);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:14px;padding:18px;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .12s ease,box-shadow .12s ease;}
.subject-card:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(0,0,0,.35);}
.subject-card-name{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3;padding-right:6px;}
.subject-card-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--text-dim);}
.subject-hero{display:flex;justify-content:space-between;align-items:center;gap:24px;background:var(--bg-elev);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:16px;padding:26px 30px;box-shadow:var(--shadow-card);flex-wrap:wrap;}
.hub-crumb{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap;}
.hub-crumb-item{cursor:pointer;color:var(--text-dim);}
.hub-crumb-item:hover{color:var(--accent);text-decoration:underline;}
.hub-crumb-item.current{color:var(--text);font-weight:700;cursor:default;}
.hub-crumb-item.current:hover{text-decoration:none;color:var(--text);}
.hub-crumb-sep{color:var(--text-dim);opacity:.5;}
.subject-color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;display:inline-block;border:2px solid transparent;}
.subject-color-swatch.selected{box-shadow:0 0 0 2px var(--bg-elev),0 0 0 4px var(--text);}
@media(max-width:700px){.subject-hero{flex-direction:column;align-items:flex-start;}}
.list-row:last-child{border-bottom:none;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-state h3{color:var(--text);margin-bottom:6px;}

/* DASHBOARD HERO — "Today's Focus": key stats + a glowing mastery ring */
.focus-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:28px;background:var(--bg-elev);border:1px solid var(--border);border-radius:20px;padding:30px 34px;box-shadow:var(--shadow-card);margin-bottom:26px;}
.focus-hero::before{content:'';position:absolute;top:-45%;right:-8%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(217,178,76,.16),transparent 70%);pointer-events:none;}
.focus-date{font-family:var(--serif);font-style:italic;color:var(--text-dim);margin:0 0 4px;font-size:14px;}
.focus-greeting{font-family:var(--serif);font-size:27px;font-weight:600;margin:0 0 20px;max-width:440px;line-height:1.25;}
.focus-stats-row{display:flex;gap:28px;margin-bottom:22px;flex-wrap:wrap;}
.focus-stat-value{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--text);line-height:1;}
.focus-stat-value.flag{color:var(--danger);}
.focus-stat-label{display:block;font-size:11px;color:var(--text-dim);margin-top:5px;}
.focus-hero-ring{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;z-index:1;}
.focus-ring-label{position:absolute;text-align:center;font-family:var(--mono);}
.focus-ring-label b{display:block;font-size:21px;color:var(--text);}
.focus-ring-label span{font-size:9.5px;color:var(--text-dim);letter-spacing:.03em;}
@media(max-width:700px){.focus-hero{flex-direction:column;align-items:flex-start;padding:24px;}.focus-hero-ring{align-self:center;}}

/* FORMS */
label{display:block;font-size:12px;color:var(--text-dim);margin:10px 0 4px;font-weight:600;}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--text);font-family:inherit;
}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,5,7,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.modal h3{margin:0 0 12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

/* NOTE EDITOR */
.note-meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.note-title-input{font-family:var(--serif);font-size:29px;font-weight:600;border:none;background:none;width:100%;padding:4px 0;color:var(--text);outline:none;}
.editor-toolbar{display:flex;gap:2px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:5;}
.editor-toolbar button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--text);}
.editor-toolbar button:hover{background:var(--bg-elev-2);}
.editor-toolbar .sep{width:1px;background:var(--border);margin:4px 4px;}
.editor-body{outline:none;min-height:300px;font-size:15.5px;line-height:1.7;max-width:68ch;}
.editor-body h2{font-family:var(--serif);font-size:22px;margin:20px 0 8px;}
.editor-body h3{font-family:var(--serif);font-size:18px;margin:16px 0 6px;}
.editor-body p{margin:0 0 10px;}
.editor-body mark{padding:1px 0;border-radius:2px;}
.editor-body mark.y{background:var(--mark-yellow);}
.editor-body mark.g{background:var(--mark-green);}
.editor-body mark.b{background:var(--mark-blue);}
.editor-body mark.r{background:var(--mark-red);}
.editor-body mark.p{background:var(--mark-purple);}
.editor-body mark.o{background:var(--mark-orange);}
.editor-body .annot-flag{cursor:pointer;font-size:11px;background:var(--accent);color:var(--ink-on-accent);border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;vertical-align:super;}
.editor-body blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:2px 14px;color:var(--text-dim);}
.editor-body table{border-collapse:collapse;width:100%;margin:10px 0;}
.editor-body td,.editor-body th{border:1px solid var(--border);padding:6px 8px;}
.save-status{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);}
.sel-toolbar{position:fixed;background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:4px;display:flex;gap:2px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.sel-toolbar button{background:none;border:none;color:inherit;padding:5px 8px;font-size:12px;border-radius:6px;}
.sel-toolbar button:hover{background:var(--accent-soft);}

.two-col{display:grid;grid-template-columns:1fr 300px;gap:24px;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
.inspector .block{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.inspector .block:last-child{border-bottom:none;}
.inspector h4{font-size:11.5px;font-family:var(--sans);font-weight:700;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px;}

/* PDF */
.pdf-shell{display:flex;flex-direction:column;height:calc(100vh - 54px);margin:-24px -28px;}
.pdf-body-row{display:flex;flex:1;min-width:0;overflow:hidden;}
.pdf-right-panel{width:220px;border-left:1px solid var(--border);padding:12px;overflow-y:auto;background:var(--bg-elev);flex-shrink:0;}
.pdf-toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg-elev);flex-wrap:wrap;}
.pdf-canvas-wrap{flex:1;min-width:0;overflow:auto;text-align:center;background:#0A0D08;padding:20px;}
.pdf-page-wrap{position:relative;display:inline-block;}
.pdf-page-wrap canvas{box-shadow:0 4px 18px rgba(0,0,0,.4);background:#fff;display:block;}
.pdf-textlayer{position:absolute;top:0;left:0;overflow:hidden;line-height:1;}
.pdf-textlayer span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;cursor:text;}
.pdf-textlayer span::selection{background:#D9B24C77;}
.pdf-hl-overlay{position:absolute;top:0;left:0;pointer-events:none;}
.pdf-hl-rect{position:absolute;pointer-events:auto;cursor:pointer;border-radius:2px;mix-blend-mode:multiply;}
.pdf-hl-rect.underline{background:none !important;border-bottom:3px solid var(--accent);border-radius:0;}
.pdf-sticky-icon{position:absolute;width:22px;height:22px;background:var(--accent);color:var(--ink-on-accent);border-radius:50% 50% 50% 4px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;pointer-events:auto;transform:translate(-50%,-100%);box-shadow:0 2px 6px rgba(0,0,0,.35);}
.icon-btn.active-toggle{background:var(--accent);color:var(--ink-on-accent);}
.pdf-ink-canvas{position:absolute;top:0;left:0;pointer-events:none;}
#pdfInkCanvas{background:transparent !important;box-shadow:none !important;}
.pdf-ink-canvas.drawing{pointer-events:auto;cursor:crosshair;touch-action:none;}
.pdf-draw-toolbar{display:flex;align-items:center;gap:6px;padding:6px 14px;border-bottom:1px solid var(--border);background:var(--accent-soft);flex-wrap:wrap;}
.pdf-draw-toolbar button{background:none;border:1px solid transparent;border-radius:6px;padding:5px 9px;font-size:13px;color:var(--text);}
.pdf-draw-toolbar button:hover{background:var(--bg-elev);}
.pdf-draw-toolbar button.active-tool{background:var(--accent);color:var(--ink-on-accent);}
.draw-color-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:inline-block;}
.draw-color-dot.selected{box-shadow:0 0 0 2px var(--accent);}

/* MOBILE — phone portrait (narrow width) or phone landscape (short height).
   iPad and other tablets, in EITHER orientation, fall outside this and get
   the full desktop sidebar layout instead of the hamburger+bottom-nav one. */
.bottom-nav{display:none;}
@media (max-width:700px), (max-width:1024px) and (max-height:500px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:.2s;}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 30px rgba(0,0,0,.4);}
  .content{padding:16px;padding-bottom:80px;}
  .grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--bg-elev);border-top:1px solid var(--border);z-index:40;padding-bottom:env(safe-area-inset-bottom);}
  .bottom-nav button{flex:1;background:none;border:none;color:var(--text-dim);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:7px;}
  .bottom-nav button.active{color:var(--accent);}
  .bottom-nav .bn-icon{font-size:18px;}
  .topbar .search-top{display:none;}
  #driveStatusBadge{display:none !important;} /* still reachable via Settings; the topbar is too narrow for it here */
  .pdf-shell{overflow-y:auto;}
  .pdf-body-row{flex-direction:column;overflow:visible;}
  .pdf-canvas-wrap{flex:none;min-height:50vh;}
  .pdf-right-panel{width:100% !important;border-left:none;border-top:1px solid var(--border);}
}
.overlay-scrim{display:none;}
@media (max-width:700px), (max-width:1024px) and (max-height:500px){.overlay-scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
@media (max-width:700px), (max-width:1024px) and (max-height:500px){.toast-wrap{bottom:70px;left:16px;right:16px;}}
.toast{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border);padding:11px 15px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);}

.cmdk-backdrop{position:fixed;inset:0;background:rgba(4,5,7,.6);backdrop-filter:blur(2px);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;}
.cmdk{width:100%;max-width:560px;background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.cmdk input{width:100%;border:none;border-bottom:1px solid var(--border);padding:15px 18px;font-size:16px;background:none;color:var(--text);outline:none;}
.cmdk-results{max-height:50vh;overflow-y:auto;}
.cmdk-item{padding:11px 18px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;}
.cmdk-item:hover,.cmdk-item.sel{background:var(--accent-soft);}
.cmdk-item small{color:var(--text-dim);font-family:var(--mono);}

.flash-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:42px 28px;text-align:center;font-size:18px;min-height:180px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-card);}
.rate-row{display:flex;gap:8px;justify-content:center;margin-top:14px;}
.rate-row button{flex:1;max-width:110px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev);font-size:13px;font-weight:700;}
.rate-row button.again{border-color:var(--danger);color:var(--danger);}
.rate-row button.hard{border-color:#D89A3F;color:#D89A3F;}
.rate-row button.good{border-color:#4FAE71;color:#4FAE71;}
.rate-row button.easy{border-color:#5B9BE0;color:#5B9BE0;}

.stars{color:var(--accent);letter-spacing:1px;}
.timer-display{font-family:var(--mono);font-weight:600;font-size:52px;text-align:center;margin:20px 0;letter-spacing:.02em;}
hr.sep{border:none;border-top:1px solid var(--border);margin:20px 0;}
.subtle{color:var(--text-dim);font-size:13px;}
.kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;font-family:var(--mono);background:var(--bg-elev-2);}

/* FOCUS MODE (DARK ROOM) */
body.focus-mode .sidebar, body.focus-mode .topbar, body.focus-mode .bottom-nav, body.focus-mode .inspector { display: none !important; }
body.focus-mode .two-col { grid-template-columns: 1fr; }
body.focus-mode .content { max-width: 780px; margin: 0 auto; padding-top: 50px; }
.focus-exit-btn{position:fixed;top:14px;right:14px;z-index:80;}

/* ACCESSIBILITY */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="overlay-scrim" id="scrim" onclick="UI.closeSidebar()" title="Close menu"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="sidebar-logo.png" alt="CA Study logo" class="sidebar-seal">
      <div class="sidebar-wordmark">Study<small>The Reading Room</small></div>
    </div>
    <div class="sidebar-section">
      <button class="nav-item" data-route="dashboard" onclick="UI.nav('dashboard')" title="Today's overview: study time, revision due, recent notes">🏠 Dashboard</button>
      <button class="nav-item nav-item-featured" data-route="subjects" onclick="UI.nav('subjects')" title="Your whole syllabus — subjects, chapters and topics, browsable and color-coded">📚 Subjects</button>
      <button class="nav-item" data-route="search" onclick="UI.nav('search')" title="Full search with filters by type, subject and sort order">🔍 Search &amp; Filters</button>
      <button class="nav-item" data-route="analytics" onclick="UI.nav('analytics')" title="Streaks, weak/strong topics, and subject breakdown">📊 Analytics</button>
      <button class="nav-item" data-route="pdfs" onclick="UI.nav('pdfs')" title="Upload, read and annotate PDFs">📄 PDF Library</button>
      <button class="nav-item" data-route="questions" onclick="UI.nav('questions')" title="Your question bank — theory, MCQ, true/false, fill-in-the-blank">❓ Questions</button>
      <button class="nav-item" data-route="revision" onclick="UI.nav('revision')" title="Spaced-repetition queue: notes and flashcards due today">🔁 Revision <span class="badge" id="revBadge">0</span></button>
      <button class="nav-item" data-route="exam" onclick="UI.nav('exam')" title="Timed practice exam with self- or auto-grading">🎓 Exam Mode</button>
      <button class="nav-item" data-route="lmr" onclick="UI.nav('lmr')" title="Rapid-fire review of only your highest-priority content">⚡ Last-Minute Revision</button>
      <button class="nav-item" data-route="mnemonics" onclick="UI.nav('mnemonics')" title="Memory aids and mnemonics you've created">🧠 Mnemonics</button>
      <button class="nav-item" data-route="jargons" onclick="UI.nav('jargons')" title="Terms, keywords and abbreviations">🔤 Jargons</button>
      <button class="nav-item" data-route="bookmarks" onclick="UI.nav('bookmarks')" title="Notes and PDF pages you've bookmarked">🔖 Bookmarks</button>
      <button class="nav-item" data-route="focus" onclick="UI.nav('focus')" title="Pomodoro-style study timer with session logging">⏱ Study Timer</button>
    </div>
    <div style="flex:1"></div>
    <div class="sidebar-section">
      <button class="nav-item" data-route="trash" onclick="UI.nav('trash')" title="Deleted items — restore or permanently remove">🗑 Trash</button>
      <button class="nav-item" data-route="settings" onclick="UI.nav('settings')" title="Theme, revision intervals, backup & restore">⚙️ Settings</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn" style="display:none" id="menuBtn" onclick="UI.toggleSidebar()" aria-label="Open menu" title="Open the subjects & navigation menu">☰</button>
      <input class="search-top" placeholder="Search or run a command…  (Ctrl/Cmd+K)" onclick="CmdK.open()" readonly aria-label="Search or run a command" title="Search notes, PDFs, questions and more — or type a command like &quot;New Note&quot;">
      <div class="spacer"></div>
      <span id="driveStatusBadge" class="pill" style="display:none;cursor:pointer;" onclick="UI.nav('settings')" title="Google Drive sync status — click to manage in Settings"></span>
      <button class="icon-btn" onclick="UI.newQuick()" title="Quick add — create a note, PDF, mnemonic, jargon or question" aria-label="Quick add">＋</button>
      <button class="icon-btn" onclick="Theme.toggle()" title="Switch between light and dark mode" aria-label="Toggle dark mode">🌓</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<nav class="bottom-nav" aria-label="Primary">
  <button data-route="dashboard" onclick="UI.nav('dashboard')" aria-label="Dashboard" title="Dashboard — today's overview"><span class="bn-icon">🏠</span>Home</button>
  <button data-route="pdfs" onclick="UI.nav('pdfs')" aria-label="PDF Library" title="Your uploaded PDFs"><span class="bn-icon">📄</span>PDFs</button>
  <button data-route="subjects" onclick="UI.nav('subjects')" aria-label="Browse subjects" title="Browse subjects, chapters and topics"><span class="bn-icon">📚</span>Browse</button>
  <button data-route="revision" onclick="UI.nav('revision')" aria-label="Revision" title="Spaced-repetition revision queue"><span class="bn-icon">🔁</span>Revise</button>
  <button onclick="CmdK.open()" aria-label="Search" title="Search everything, or run a command"><span class="bn-icon">🔍</span>Search</button>
</nav>

<input type="file" id="noteImportInput" accept=".txt,.md,.markdown,.html,.htm" style="display:none" onchange="Notes.handleImportFile(this)">
<div class="toast-wrap" id="toastWrap"></div>

<script src="app.js"></script>
</body>
</html>
